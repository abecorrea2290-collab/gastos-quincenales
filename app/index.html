  const [view, setView] = React.useState('q');
  const [year, setYear] = React.useState(new Date().getFullYear());
  const [period, setPeriod] = React.useState(() => {
    const now = new Date();
    return { m: now.getMonth(), q: now.getDate() <= 15 ? 1 : 2 };
  });
  const [data, setData] = React.useState(SEED);
  const [screen, setScreen] = React.useState('panel');
  const [toast, setToast] = React.useState(null);
  const [recModal, setRecModal] = React.useState(false);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };

  const getP = (y, m, q) => data[periodKey(y, m, q)] || { income:0, transferIn:0, transferLabel:'', extraIncome:[], items:[], closed:false };
  const setP = (y, m, q, next) => setData(d => ({ ...d, [periodKey(y, m, q)]: next }));

  const curData = view === 'q' ? getP(year, period.m, period.q) : null;

  const totals = React.useMemo(() => {
    if (view === 'q') {
      const d = getP(year, period.m, period.q);
      const extra = (d.extraIncome || []).reduce((a,i) => a+i.amount, 0);
      const totalIn = d.income + d.transferIn + extra;
      const totalOut = (d.items || []).reduce((a,i) => a+i.amount, 0);
      return { totalIn, totalOut, bal:totalIn-totalOut, pct:totalIn>0?Math.round(totalOut/totalIn*100):0, extra };
    }
    const d1 = getP(year, period.m, 1), d2 = getP(year, period.m, 2);
    const e1 = (d1.extraIncome||[]).reduce((a,i)=>a+i.amount,0);
    const e2 = (d2.extraIncome||[]).reduce((a,i)=>a+i.amount,0);
    const totalIn = d1.income+d1.transferIn+e1 + d2.income+d2.transferIn+e2;
    const items = [...(d1.items||[]).map(i=>({...i,_q:1})), ...(d2.items||[]).map(i=>({...i,_q:2}))];
    const totalOut = items.reduce((a,i)=>a+i.amount, 0);
    return { totalIn, totalOut, bal:totalIn-totalOut, pct:totalIn>0?Math.round(totalOut/totalIn*100):0, items, d1, d2 };
  }, [view, year, period, data]);

  return (
    <div className="app">
      <aside className="sb">
        <a className="sb-back" href="/">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Inicio
        </a>
        <div className="sb-logo">
          <LogoIcon/>
          <span style={{ fontSize:24, fontWeight:800, letterSpacing:'-0.5px' }}>Gastos</span>
        </div>
        <nav className="sb-nav">
          {NAV_ITEMS.map(it => (
            <div key={it.id} className={'sb-item' + (screen === it.id ? ' active' : '')} onClick={() => setScreen(it.id)}>
              {it.icon}{it.label}
            </div>
          ))}
        </nav>
      </aside>

      <nav className="bottom-nav">
        {NAV_ITEMS.map(it => (
          <button key={it.id} className={'bottom-nav-item' + (screen === it.id ? ' active' : '')} onClick={() => setScreen(it.id)}>
            {it.icon}
            <span>{it.short || it.label}</span>
          </button>
        ))}
      </nav>

      <div className="main">
        <div className="topbar">
          <div style={{ display:'flex', alignItems:'center', gap:16, flexWrap:'wrap' }}>
            <div className="tabs-pill">
              <button className={view==='q'?'active':''} onClick={() => setView('q')}>Quincenal</button>
              <button className={view==='m'?'active':''} onClick={() => setView('m')}>Mensual</button>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <button className="btn btn-sm btn-ghost" onClick={() => setYear(y => Math.max(2020, y-1))}>←</button>
              <span className="num" style={{ fontSize:14, fontWeight:700, minWidth:50, textAlign:'center' }}>{year}</span>
              <button className="btn btn-sm btn-ghost" onClick={() => setYear(y => y+1)}>→</button>
            </div>
          </div>
          <div className="user-chip">
            <div className="user-av">G</div>
            <span style={{ fontSize:12, color:'#b3b3b3' }}>Gastos</span>
          </div>
        </div>

        {screen === 'panel' && (
          <div className="content">
            <div className="period-tabs">
              {view === 'q' ? MN.flatMap((mn,mi) => [1,2].map(q => {
                const active = mi === period.m && q === period.q;
                const past = mi < period.m || (mi === period.m && q < period.q);
                return (
                  <button key={`${mi}-${q}`} className={'period-tab' + (active?' active':past?' past':'')} onClick={() => setPeriod({ m:mi, q })}>
                    <span className="pt-name">{mn} Q{q}</span>
                    <span className="pt-date">{q===1?'1–15':'16–fin'} {mn}</span>
                  </button>
                );
              })) : MN.map((mn,mi) => {
                const active = mi === period.m;
                const past = mi < period.m;
                return (
                  <button key={mi} className={'period-tab' + (active?' active':past?' past':'')} onClick={() => setPeriod({ m:mi, q:1 })}>
                    <span className="pt-name">{mn}</span>
                    <span className="pt-date">{year}</span>
                  </button>
                );
              })}
            </div>

            <Hero view={view} period={period} year={year} totals={totals} curData={curData}/>

            {totals.pct >= 80 && (
              <div style={{ background: totals.pct >= 95 ? 'rgba(243,114,127,0.1)' : 'rgba(255,164,43,0.1)', border:`1px solid ${totals.pct>=95?'#f3727f':'#ffa42b'}`, padding:'14px 18px', borderRadius:8, color: totals.pct>=95?'#f3727f':'#ffa42b', fontSize:13, fontWeight:600, display:'flex', alignItems:'center', gap:10 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
                {totals.pct>=95 ? `Has consumido el ${totals.pct}% del presupuesto. Cuidado con los gastos.` : `Llevas el ${totals.pct}% del presupuesto. Revisa tus movimientos.`}
              </div>
            )}

            <div className="grid-4">
              <Stat label="Ingreso base" value={view==='q' ? (curData?.income||0) : ((totals.d1?.income||0)+(totals.d2?.income||0))} tone="positive"/>
              <Stat label="Total disponible" value={totals.totalIn} sub={view==='q' && curData?.transferIn>0 ? `+ ${fmt(curData.transferIn)} sobrante` : null}/>
              <Stat label="Gastos" value={-totals.totalOut} tone="negative" sub={`${view==='q' ? (curData?.items||[]).length : (totals.items||[]).length} movimientos`}/>
              <Stat label="Saldo" value={totals.bal} tone={totals.bal>=0?'positive':'negative'} sub={totals.bal>=0?'Pasa a la próxima Q':'Déficit'}/>
            </div>

            <div className="card">
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:12 }}>
                <span className="eyebrow">Consumo del presupuesto</span>
                <span className="num" style={{ fontSize:32, fontWeight:800, color: totals.pct>=95?'#f3727f':totals.pct>=80?'#ffa42b':'#1ed760', letterSpacing:'-1px' }}>{totals.pct}%</span>
              </div>
              <div className="progress" style={{ height:8 }}>
                <div style={{ width:`${Math.min(100,totals.pct)}%`, background: totals.pct>=95?'#f3727f':totals.pct>=80?'#ffa42b':'#1ed760' }}/>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', marginTop:10, fontSize:12, color:'#b3b3b3' }}>
                <span className="num">{fmt(totals.totalOut)} gastado</span>
                <span className="num">{fmt(totals.totalIn)} disponible</span>
              </div>
            </div>

            {view === 'q' && curData && !curData.closed && (
              <div className="grid-2">
                <IncomeForm data={curData} onSave={(inc) => { setP(year,period.m,period.q, { ...curData, income:inc }); showToast('Guardado'); }}/>
                <ExtraIncomeForm data={curData} onAdd={(ei) => { setP(year,period.m,period.q, { ...curData, extraIncome:[...(curData.extraIncome||[]), ei] }); showToast('Ingreso extra guardado'); }}/>
              </div>
            )}

            {view === 'q' && curData && !curData.closed && (
              <ExpenseForm cats={cats.filter(c => c.active)} onAdd={(it) => { setP(year,period.m,period.q, { ...curData, items:[...(curData.items||[]), it] }); showToast('Gasto guardado'); }}/>
            )}

            {((view === 'q' && curData && !curData.closed) || view === 'm') && (
              <div className="card">
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:16, gap:10, flexWrap:'wrap' }}>
                  <h2 style={{ fontSize:18, fontWeight:700, margin:0 }}>Recurrentes</h2>
                  <div style={{ display:'flex', gap:8 }}>
                    <button className="btn btn-sm btn-ghost" onClick={() => setScreen('recurrentes')}>Gestionar</button>
                    <button className="btn btn-sm btn-primary" onClick={() => setRecModal(true)}>
                      {view === 'm' ? 'Aplicar al mes →' : 'Aplicar selección →'}
                    </button>
                  </div>
                </div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
                  {recurrentes.map(r => (
                    <button key={r.id} onClick={() => setEditRec(r)} className="chip" style={{ cursor:'pointer', background:'#252525' }}>
                      <span className="dot" style={{ background:catColor(r.cat, cats) }}/>
                      {r.desc} · <span className="num">{fmt(r.amount)}</span>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{ marginLeft:2, opacity:0.6 }}><path d="M12 20h9M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </button>
                  ))}
                </div>
              </div>
            )}

            <Movements view={view} totals={totals} curData={curData} period={period} cats={cats} onDelete={(id) => {
              if (view === 'q') setP(year,period.m,period.q, { ...curData, items:(curData.items||[]).filter(i=>i.id!==id) });
              showToast('Gasto eliminado');
            }}/>

            <CategoryBreakdown items={view==='q' ? (curData?.items||[]) : (totals.items||[])} total={totals.totalOut} cats={cats}/>

            <YearChart year={year} data={data}/>
          </div>
        )}

        {screen === 'resumen' && <AnnualSummary year={year} data={data} cats={cats}/>}
        {screen === 'recurrentes' && <RecurrentesScreen
          recurrentes={recurrentes}
          onEdit={r => setEditRec(r)}
          onDelete={id => { setRecurrentes(rs => rs.filter(r => r.id !== id)); showToast('Recurrente eliminado'); }}
          onAdd={r => {
            const id = `r-${Date.now()}`;
            const today = new Date().toISOString().split('T')[0];
            setRecurrentes(rs => [...rs, { ...r, id, history:[{ id:`h-${id}`, date:today, amount:r.amount, note:'Monto inicial' }] }]);
            showToast('Recurrente creado');
          }}
          cats={cats}
        />}
        {screen === 'categorias' && <CategoriasScreen
          cats={cats}
          onAdd={name => { if (!name.trim()) return; setCats(cs => [...cs, { n:name.trim(), c:'#a0aec0', active:true, custom:true }]); showToast('Categoría agregada'); }}
          onToggle={n => setCats(cs => cs.map(c => c.n === n ? { ...c, active:!c.active } : c))}
          onDelete={n => { setCats(cs => cs.filter(c => !(c.n === n && c.custom))); showToast('Categoría eliminada'); }}
          usedCats={new Set(Object.values(data).flatMap(d => (d.items||[]).map(i => i.cat)))}
        />}
        {screen === 'config' && <ConfigScreen
          year={year}
          data={data}
          onClearYear={() => {
            setData(d => Object.fromEntries(Object.entries(d).filter(([k]) => !k.startsWith(`${year}_`))));
            showToast(`Datos de ${year} eliminados`);
          }}
          onClearItems={() => {
            setData(d => Object.fromEntries(Object.entries(d).map(([k,v]) => [k, { ...v, items:[] }])));
            showToast('Gastos eliminados');
          }}
          onClearAll={() => {
            setData({});
            setRecurrentes([]);
            showToast('Todos los datos eliminados');
          }}
          onResetDemo={() => {
            setData(SEED);
            setRecurrentes(RECURRENTES_SEED);
            setCats(CATS.map(c => ({ ...c, active:true, custom:false })));
            showToast('Datos demo restaurados');
          }}
        />}
      </div>

      {editRec && <EditRecurrenteModal rec={editRec} cats={cats} onClose={() => setEditRec(null)} onSave={r => {
        setRecurrentes(rs => rs.map(x => x.id === r.id ? r : x));
        setEditRec(null);
        showToast('Recurrente actualizado');
      }}/>}

      {recModal && <RecurrentesModal recurrentes={recurrentes} view={view} onClose={() => setRecModal(false)} onApply={(selected) => {
        const today = new Date().toISOString().split('T')[0];
        if (view === 'q' && curData) {
          const newItems = selected.map(r => ({ ...r, id:`r-${Date.now()}-${Math.random()}`, date:today, rec:true }));
          setP(year,period.m,period.q, { ...curData, items:[...(curData.items||[]), ...newItems] });
          showToast(`${selected.length} recurrentes aplicados`);
        } else if (view === 'm') {
          const d1 = getP(year, period.m, 1), d2 = getP(year, period.m, 2);
          const mm = String(period.m+1).padStart(2,'0');
          const newQ1 = selected.map(r => ({ ...r, id:`r-${Date.now()}-${Math.random()}-1`, date:`${year}-${mm}-01`, rec:true }));
          const newQ2 = selected.map(r => ({ ...r, id:`r-${Date.now()}-${Math.random()}-2`, date:`${year}-${mm}-16`, rec:true }));
          setP(year, period.m, 1, { ...d1, items:[...(d1.items||[]), ...newQ1] });
          setP(year, period.m, 2, { ...d2, items:[...(d2.items||[]), ...newQ2] });
          showToast(`${selected.length * 2} recurrentes aplicados al mes`);
        }
        setRecModal(false);
      }}/>}
      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

function Hero({ view, period, year, totals, curData }) {
  const title = view === 'q' ? `${MN_FULL[period.m]} Q${period.q}` : `${MN_FULL[period.m]} ${year}`;
  const payDate = view === 'q' ? (period.q === 1 ? 15 : 30) : null;
  return (
    <div style={{ display:'flex', alignItems:'flex-end', gap:24, padding:'12px 0 8px' }}>
      <div style={{
        width:88, height:88, borderRadius:'50%', background:'#1ed760',
        display:'flex', alignItems:'center', justifyContent:'center',
        boxShadow:'rgba(30,215,96,0.25) 0 8px 30px', flexShrink:0,
      }}>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#121212" strokeWidth="3.5" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div>
        <div className="eyebrow" style={{ color:'#1ed760' }}>{view === 'q' ? 'Quincena' : 'Mes'} · {year}</div>
        <div className="num" style={{ fontSize:64, fontWeight:800, letterSpacing:'-2px', margin:'6px 0 10px', lineHeight:1 }}>
          {fmt(totals.totalIn - totals.totalOut)}
        </div>
        <div style={{ display:'flex', gap:20, flexWrap:'wrap', fontSize:13 }}>
          <span style={{ color:'#b3b3b3' }}>{title}</span>
          {payDate && <span style={{ color:'#b3b3b3' }}>· Pago día {payDate}</span>}
          <span style={{ color:'#b3b3b3' }}>· <span className="num" style={{ color:'#fff' }}>{fmt(totals.totalOut)}</span> gastado</span>
          {view === 'q' && curData?.closed && <span className="pill" style={{ background:'#1ed76022', color:'#1ed760' }}>Cerrada</span>}
        </div>
      </div>
    </div>
  );
}

function Stat({ label, value, sub, tone }) {
  const color = tone === 'positive' ? '#1ed760' : tone === 'negative' ? '#f3727f' : '#fff';
  return (
    <div className="card">
      <div className="eyebrow" style={{ marginBottom:10 }}>{label}</div>
      <div className="num" style={{ fontSize:26, fontWeight:800, color, letterSpacing:'-0.5px' }}>{fmt(value)}</div>
      {sub && <div style={{ fontSize:11, color:'#7c7c7c', marginTop:6 }}>{sub}</div>}
    </div>
  );
}

function IncomeForm({ data, onSave }) {
  const [val, setVal] = React.useState(data.income || '');
  React.useEffect(() => setVal(data.income || ''), [data]);
  return (
    <div className="card">
      <h2 style={{ fontSize:18, fontWeight:700, margin:'0 0 16px' }}>Ingreso base</h2>
      <div style={{ display:'flex', gap:10, alignItems:'flex-end' }}>
        <div style={{ flex:1 }}>
          <label>Monto (COP)</label>
          <input type="number" value={val} onChange={e => setVal(e.target.value)} placeholder="0"/>
        </div>
        <button className="btn btn-primary" onClick={() => onSave(Number(val)||0)}>Guardar</button>
      </div>
      {data.transferIn > 0 && (
        <div style={{ marginTop:14, padding:12, background:'rgba(83,157,245,0.1)', borderRadius:6, fontSize:12, color:'#539df5' }}>
          + <span className="num">{fmt(data.transferIn)}</span> sobrante · {data.transferLabel}
        </div>
      )}
    </div>
  );
}

function ExtraIncomeForm({ data, onAdd }) {
  const [desc, setDesc] = React.useState('');
  const [amt, setAmt] = React.useState('');
  const add = () => {
    if (!desc || !amt) return;
    onAdd({ id:`e-${Date.now()}`, desc, amount:Number(amt) });
    setDesc(''); setAmt('');
  };
  return (
    <div className="card">
      <h2 style={{ fontSize:18, fontWeight:700, margin:'0 0 16px' }}>Ingresos adicionales</h2>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 140px auto', gap:10, alignItems:'flex-end' }}>
        <div><label>Descripción</label><input value={desc} onChange={e => setDesc(e.target.value)} placeholder="Horas extra, freelance..."/></div>
        <div><label>Monto</label><input type="number" value={amt} onChange={e => setAmt(e.target.value)} placeholder="0"/></div>
        <button className="btn btn-primary" onClick={add}>+ Añadir</button>
      </div>
      {(data.extraIncome||[]).length > 0 && (
        <div style={{ marginTop:14, display:'flex', flexDirection:'column', gap:6 }}>
          {data.extraIncome.map(ei => (
            <div key={ei.id} style={{ display:'flex', justifyContent:'space-between', padding:'8px 12px', background:'#121212', borderRadius:4, fontSize:12 }}>
              <span style={{ color:'#b3b3b3' }}>{ei.desc}</span>
              <span className="num" style={{ color:'#ffa42b', fontWeight:700 }}>{fmt(ei.amount)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ExpenseForm({ onAdd, cats }) {
  const [ref, setRef] = React.useState('');
  const [desc, setDesc] = React.useState('');
  const [amt, setAmt] = React.useState('');
  const [cat, setCat] = React.useState(cats[0]?.n || '');
  const [date, setDate] = React.useState(new Date().toISOString().split('T')[0]);
  const [rec, setRec] = React.useState(false);

  React.useEffect(() => { if (!cats.find(c => c.n === cat) && cats[0]) setCat(cats[0].n); }, [cats]);

  const add = () => {
    if (!desc || !amt) return;
    onAdd({ id:`i-${Date.now()}`, ref, desc, amount:Number(amt), cat, date, rec });
    setRef(''); setDesc(''); setAmt(''); setRec(false);
  };

  return (
    <div className="card">
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:16 }}>
        <h2 style={{ fontSize:18, fontWeight:700, margin:0 }}>Añadir gasto</h2>
        <span style={{ fontSize:11, color:'#7c7c7c' }}>Se registra en la quincena activa</span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'140px 1fr 140px 180px 150px', gap:12, alignItems:'flex-end' }} className="form-grid-expense">
        <div><label>Referencia</label><input value={ref} onChange={e => setRef(e.target.value)} placeholder="**** 1234"/></div>
        <div><label>Descripción</label><input value={desc} onChange={e => setDesc(e.target.value)} placeholder="Arriendo, mercado..."/></div>
        <div><label>Valor (COP)</label><input type="number" value={amt} onChange={e => setAmt(e.target.value)} placeholder="0"/></div>
        <div><label>Categoría</label><select value={cat} onChange={e => setCat(e.target.value)}>{cats.map(c => <option key={c.n} value={c.n}>{c.n}</option>)}</select></div>
        <div><label>Fecha</label><input type="date" value={date} onChange={e => setDate(e.target.value)}/></div>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:16 }}>
        <label style={{ display:'flex', alignItems:'center', gap:8, margin:0, cursor:'pointer' }}>
          <input type="checkbox" checked={rec} onChange={e => setRec(e.target.checked)} style={{ width:'auto' }}/>
          <span style={{ color:'#b3b3b3', fontSize:12, textTransform:'none', letterSpacing:0, fontWeight:400 }}>Marcar como recurrente</span>
        </label>
        <button className="btn btn-primary" onClick={add}>Guardar gasto</button>
      </div>
    </div>
  );
}

function Movements({ view, totals, curData, period, cats, onDelete }) {
  const items = view === 'q' ? (curData?.items||[]) : (totals.items||[]);
  return (
    <div className="card" style={{ padding:0, overflow:'hidden' }}>
      <div style={{ padding:'20px 20px 12px', display:'flex', justifyContent:'space-between', alignItems:'baseline' }}>
        <h2 style={{ fontSize:18, fontWeight:700, margin:0 }}>Movimientos</h2>
        <span style={{ fontSize:11, color:'#7c7c7c', textTransform:'uppercase', letterSpacing:1.2, fontWeight:700 }}>
          {items.length} · <span className="num">{fmt(items.reduce((a,i)=>a+i.amount,0))}</span>
        </span>
      </div>
      {items.length === 0 ? (
        <div style={{ padding:40, textAlign:'center', color:'#7c7c7c', fontSize:13 }}>Aún no hay movimientos. Añade el primero.</div>
      ) : (
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Descripción</th>
                <th>Categoría</th>
                {view==='m' && <th>Q</th>}
                <th>Fecha</th>
                <th>Ref.</th>
                <th style={{ textAlign:'right' }}>Monto</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {items.map(it => (
                <tr key={it.id}>
                  <td style={{ fontWeight:700, color:'#fff' }}>
                    {it.desc} {it.rec && <span className="pill" style={{ marginLeft:8, background:'#539df522', color:'#539df5' }}>↻</span>}
                  </td>
                  <td>
                    <span className="chip"><span className="dot" style={{ background:catColor(it.cat, cats) }}/>{it.cat}</span>
                  </td>
                  {view==='m' && <td><span className="pill">Q{it._q}</span></td>}
                  <td style={{ color:'#b3b3b3' }}>{new Date(it.date+'T00:00').toLocaleDateString('es-CO', { day:'numeric', month:'short' })}</td>
                  <td style={{ color:'#7c7c7c', fontSize:11 }}>{it.ref || '—'}</td>
                  <td className="num" style={{ textAlign:'right', fontWeight:800, color:'#f3727f' }}>−{fmt(it.amount)}</td>
                  <td style={{ textAlign:'right' }}>
                    <button onClick={() => onDelete && onDelete(it.id)} style={{ background:'transparent', border:'none', color:'#7c7c7c', cursor:'pointer', padding:6 }} title="Eliminar">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function CategoryBreakdown({ items, total, cats }) {
  const byCat = {};
  items.forEach(it => { byCat[it.cat] = (byCat[it.cat] || 0) + it.amount; });
  const sorted = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  if (sorted.length === 0) return null;
  return (
    <div className="card">
      <h2 style={{ fontSize:18, fontWeight:700, margin:'0 0 20px' }}>Por categoría</h2>
      <div style={{ display:'grid', gridTemplateColumns:'220px 1fr', gap:32, alignItems:'center' }} className="catbreak-grid">
        <Donut items={sorted} total={total} cats={cats}/>
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {sorted.map(([cat, amt]) => {
            const pct = total>0 ? Math.round(amt/total*100) : 0;
            return (
              <div key={cat}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4, fontSize:12 }}>
                  <span style={{ display:'flex', alignItems:'center', gap:8 }}>
                    <span className="dot" style={{ background:catColor(cat, cats) }}/>
                    <span style={{ color:'#fff', fontWeight:700 }}>{cat}</span>
                    <span style={{ color:'#7c7c7c' }}>{pct}%</span>
                  </span>
                  <span className="num" style={{ color:'#b3b3b3', fontWeight:700 }}>{fmt(amt)}</span>
                </div>
                <div className="progress"><div style={{ width:`${pct}%`, background:catColor(cat, cats) }}/></div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Donut({ items, total, cats }) {
  const size = 180, stroke = 28, r = (size - stroke) / 2, C = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div style={{ position:'relative', width:size, height:size, margin:'0 auto' }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#252525" strokeWidth={stroke}/>
        {items.map(([cat, amt]) => {
          const pct = amt / total;
          const dash = pct * C;
          const el = <circle key={cat} cx={size/2} cy={size/2} r={r} fill="none" stroke={catColor(cat, cats)} strokeWidth={stroke} strokeDasharray={`${dash} ${C-dash}`} strokeDashoffset={-offset}/>;
          offset += dash;
          return el;
        })}
      </svg>
      <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
        <div className="eyebrow" style={{ fontSize:10 }}>Total</div>
        <div className="num" style={{ fontSize:18, fontWeight:800 }}>{fmt(total)}</div>
      </div>
    </div>
  );
}

function YearChart({ year, data }) {
  const months = MN.map((_, mi) => {
    const d1 = data[`${year}_${mi}_1`] || { items:[] };
    const d2 = data[`${year}_${mi}_2`] || { items:[] };
    const out = [...(d1.items||[]), ...(d2.items||[])].reduce((a,i)=>a+i.amount, 0);
    const inc = (d1.income||0) + (d2.income||0);
    return { mi, out, inc };
  });
  const max = Math.max(...months.map(m => Math.max(m.out, m.inc)), 1);
  return (
    <div className="card">
      <h2 style={{ fontSize:18, fontWeight:700, margin:'0 0 6px' }}>Evolución {year}</h2>
      <div style={{ display:'flex', gap:16, fontSize:11, color:'#b3b3b3', marginBottom:20 }}>
        <span style={{ display:'flex', alignItems:'center', gap:6 }}><span className="dot" style={{ background:'#1ed760' }}/>Ingresos</span>
        <span style={{ display:'flex', alignItems:'center', gap:6 }}><span className="dot" style={{ background:'#f3727f' }}/>Gastos</span>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(12,1fr)', gap:10, alignItems:'end', height:180 }}>
        {months.map(m => (
          <div key={m.mi} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, height:'100%' }}>
            <div style={{ flex:1, display:'flex', alignItems:'flex-end', gap:3, width:'100%', justifyContent:'center' }}>
              <div style={{ width:10, height:`${m.inc/max*100}%`, background:'#1ed760', borderRadius:2, minHeight:m.inc>0?2:0 }}/>
              <div style={{ width:10, height:`${m.out/max*100}%`, background:'#f3727f', borderRadius:2, minHeight:m.out>0?2:0 }}/>
            </div>
            <div style={{ fontSize:10, color:'#7c7c7c', fontWeight:700 }}>{MN[m.mi]}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AnnualSummary({ year, data, cats }) {
  const months = MN.map((_, mi) => {
    const d1 = data[`${year}_${mi}_1`] || { items:[], income:0 };
    const d2 = data[`${year}_${mi}_2`] || { items:[], income:0 };
    const out = [...(d1.items||[]), ...(d2.items||[])].reduce((a,i)=>a+i.amount, 0);
    const inc = (d1.income||0) + (d2.income||0);
    return { mi, out, inc, bal:inc-out };
  });
  const totalIn = months.reduce((a,m)=>a+m.inc, 0);
  const totalOut = months.reduce((a,m)=>a+m.out, 0);

  const allItems = Object.entries(data)
    .filter(([k]) => k.startsWith(`${year}_`))
    .flatMap(([,d]) => d.items || []);
  const byCat = {};
  allItems.forEach(i => { byCat[i.cat] = (byCat[i.cat]||0) + i.amount; });
  const catList = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const catMax = catList[0]?.[1] || 1;

  return (
    <div className="content">
      <div style={{ display:'flex', alignItems:'flex-end', gap:20 }}>
        <div>
          <div className="eyebrow" style={{ color:'#1ed760' }}>Resumen anual · {year}</div>
          <h1 style={{ fontSize:48, fontWeight:800, letterSpacing:'-1.5px', margin:'8px 0 0' }}>Año {year}</h1>
        </div>
      </div>
      <div className="grid-3">
        <Stat label="Ingresos año" value={totalIn} tone="positive"/>
        <Stat label="Gastos año" value={-totalOut} tone="negative"/>
        <Stat label="Saldo año" value={totalIn-totalOut} tone={totalIn-totalOut>=0?'positive':'negative'}/>
      </div>
      <YearChart year={year} data={data}/>

      <div className="card">
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:20 }}>
          <h2 style={{ fontSize:18, fontWeight:700, margin:0 }}>Gastos por categoría</h2>
          <span style={{ fontSize:11, color:'#7c7c7c', textTransform:'uppercase', letterSpacing:1.2, fontWeight:700 }}>
            {catList.length} categorías · <span className="num">{fmt(totalOut)}</span>
          </span>
        </div>
        {catList.length === 0 ? (
          <div style={{ padding:20, textAlign:'center', color:'#7c7c7c', fontSize:13 }}>Sin gastos registrados este año.</div>
        ) : (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            {catList.map(([cat, amt]) => {
              const pct = totalOut > 0 ? (amt/totalOut*100) : 0;
              return (
                <div key={cat} style={{ display:'grid', gridTemplateColumns:'180px 1fr 120px 60px', gap:16, alignItems:'center' }} className="catyear-row">
                  <div style={{ display:'flex', alignItems:'center', gap:10, fontSize:13, fontWeight:700 }}>
                    <span className="dot" style={{ background:catColor(cat, cats) }}/>
                    {cat}
                  </div>
                  <div className="progress" style={{ height:8 }}>
                    <div style={{ width:`${(amt/catMax)*100}%`, background:catColor(cat, cats) }}/>
                  </div>
                  <div className="num" style={{ textAlign:'right', fontWeight:700, color:'#fff' }}>{fmt(amt)}</div>
                  <div style={{ textAlign:'right', fontSize:12, color:'#7c7c7c', fontWeight:700 }}>{pct.toFixed(1)}%</div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="card" style={{ padding:0, overflow:'hidden' }}>
        <div style={{ padding:'20px' }}><h2 style={{ fontSize:18, fontWeight:700, margin:0 }}>Desglose mensual</h2></div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Mes</th><th style={{ textAlign:'right' }}>Ingresos</th><th style={{ textAlign:'right' }}>Gastos</th><th style={{ textAlign:'right' }}>Saldo</th><th style={{ textAlign:'right' }}>% Uso</th></tr></thead>
            <tbody>
              {months.map(m => {
                const pct = m.inc>0 ? Math.round(m.out/m.inc*100) : 0;
                return (
                  <tr key={m.mi}>
                    <td style={{ fontWeight:700 }}>{MN_FULL[m.mi]}</td>
                    <td className="num" style={{ textAlign:'right', color:'#1ed760', fontWeight:700 }}>{fmt(m.inc)}</td>
                    <td className="num" style={{ textAlign:'right', color:'#f3727f', fontWeight:700 }}>{fmt(m.out)}</td>
                    <td className="num" style={{ textAlign:'right', fontWeight:700, color: m.bal>=0?'#1ed760':'#f3727f' }}>{fmt(m.bal)}</td>
                    <td style={{ textAlign:'right', color:'#b3b3b3', fontWeight:700 }}>{pct}%</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function RecurrentesScreen({ recurrentes, onEdit, onDelete, onAdd, cats }) {
  const [addOpen, setAddOpen] = React.useState(false);
  const [desc, setDesc] = React.useState('');
  const [amt, setAmt] = React.useState('');
  const activeCats = cats.filter(c => c.active);
  const [cat, setCat] = React.useState(activeCats[0]?.n || '');
  const [ref, setRef] = React.useState('');
  const submit = () => {
    if (!desc || !amt) return;
    onAdd({ desc, amount:Number(amt), cat, ref });
    setDesc(''); setAmt(''); setRef(''); setAddOpen(false);
  };
  return (
    <div className="content">
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', gap:16, flexWrap:'wrap' }}>
        <div>
          <div className="eyebrow" style={{ color:'#1ed760' }}>Config</div>
          <h1 style={{ fontSize:48, fontWeight:800, letterSpacing:'-1.5px', margin:'8px 0 12px' }}>Gastos recurrentes</h1>
          <p style={{ color:'#b3b3b3', fontSize:14, maxWidth:600, margin:0 }}>Los que se repiten cada quincena o cada mes. Edítalos, elimínalos o agrega nuevos.</p>
        </div>
        <button className="btn btn-primary" onClick={() => setAddOpen(o => !o)}>{addOpen ? 'Cancelar' : '+ Nuevo recurrente'}</button>
      </div>
      {addOpen && (
        <div className="card">
          <h2 style={{ fontSize:16, fontWeight:700, margin:'0 0 16px' }}>Nuevo recurrente</h2>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 140px 180px 140px auto', gap:12, alignItems:'flex-end' }} className="form-grid-rec">
            <div><label>Descripción</label><input value={desc} onChange={e => setDesc(e.target.value)} placeholder="Ej. Arriendo"/></div>
            <div><label>Monto</label><input type="number" value={amt} onChange={e => setAmt(e.target.value)} placeholder="0"/></div>
            <div><label>Categoría</label><select value={cat} onChange={e => setCat(e.target.value)}>{activeCats.map(c => <option key={c.n} value={c.n}>{c.n}</option>)}</select></div>
            <div><label>Referencia</label><input value={ref} onChange={e => setRef(e.target.value)} placeholder="**** 1234"/></div>
            <button className="btn btn-primary" onClick={submit}>Guardar</button>
          </div>
        </div>
      )}
      <div className="card" style={{ padding:0, overflow:'hidden' }}>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Descripción</th><th>Categoría</th><th>Ref.</th><th style={{ textAlign:'right' }}>Monto</th><th style={{ textAlign:'center', width:80 }}>Cambios</th><th style={{ width:140, textAlign:'right' }}>Acciones</th></tr></thead>
            <tbody>
              {recurrentes.map(r => {
                const hist = r.history || [];
                const changes = Math.max(0, hist.length - 1);
                const first = hist[0];
                const delta = first ? r.amount - first.amount : 0;
                return (
                <tr key={r.id}>
                  <td style={{ fontWeight:700 }}>{r.desc}</td>
                  <td><span className="chip"><span className="dot" style={{ background:catColor(r.cat, cats) }}/>{r.cat}</span></td>
                  <td style={{ color:'#7c7c7c' }}>{r.ref || '—'}</td>
                  <td className="num" style={{ textAlign:'right', fontWeight:800 }}>{fmt(r.amount)}</td>
                  <td style={{ textAlign:'center' }}>
                    {changes > 0 ? (
                      <button onClick={() => onEdit(r)} style={{ background:'transparent', border:'none', cursor:'pointer', padding:0, display:'inline-flex', alignItems:'center', gap:6 }} title="Ver historial">
                        <span className="pill" style={{ background:'#1ed76022', color:'#1ed760' }}>{changes} {changes===1?'cambio':'cambios'}</span>
                        {delta !== 0 && <span className="num" style={{ fontSize:10, fontWeight:700, color: delta>0?'#f3727f':'#1ed760' }}>{delta>0?'↑':'↓'}{fmt(Math.abs(delta))}</span>}
                      </button>
                    ) : <span style={{ color:'#4d4d4d', fontSize:11 }}>—</span>}
                  </td>
                  <td style={{ textAlign:'right' }}>
                    <button onClick={() => onEdit(r)} style={{ background:'transparent', border:'none', color:'#539df5', cursor:'pointer', padding:6, marginRight:4 }} title="Editar">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    </button>
                    <button onClick={() => onDelete(r.id)} style={{ background:'transparent', border:'none', color:'#f3727f', cursor:'pointer', padding:6 }} title="Eliminar">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                    </button>
                  </td>
                </tr>
                );
              })}
              {recurrentes.length === 0 && <tr><td colSpan="6" style={{ textAlign:'center', padding:40, color:'#7c7c7c' }}>Sin recurrentes. Agrega el primero.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function EditRecurrenteModal({ rec, cats, onClose, onSave }) {
  const [desc, setDesc] = React.useState(rec.desc);
  const [amt, setAmt] = React.useState(rec.amount);
  const [cat, setCat] = React.useState(rec.cat);
  const [ref, setRef] = React.useState(rec.ref || '');
  const [note, setNote] = React.useState('');
  const history = rec.history || [];
  const amountChanged = Number(amt) !== Number(rec.amount);
  const diff = Number(amt) - Number(rec.amount);

  const save = () => {
    const next = { ...rec, desc, amount:Number(amt)||0, cat, ref };
    if (amountChanged || note.trim()) {
      next.history = [...history, {
        id:`h-${Date.now()}`,
        date: new Date().toISOString().split('T')[0],
        amount: Number(amt)||0,
        note: note.trim() || (amountChanged ? '(sin nota)' : 'Ajuste sin cambio de monto'),
      }];
    }
    onSave(next);
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth:560 }}>
        <h2 style={{ fontSize:22, fontWeight:800, margin:'0 0 20px' }}>Editar recurrente</h2>
        <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
          <div><label>Descripción</label><input value={desc} onChange={e => setDesc(e.target.value)}/></div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
            <div><label>Monto</label><input type="number" value={amt} onChange={e => setAmt(e.target.value)}/></div>
            <div><label>Categoría</label><select value={cat} onChange={e => setCat(e.target.value)}>{cats.filter(c => c.active).map(c => <option key={c.n} value={c.n}>{c.n}</option>)}</select></div>
          </div>
          <div><label>Referencia</label><input value={ref} onChange={e => setRef(e.target.value)} placeholder="**** 1234"/></div>

          <div style={{
            background: amountChanged ? 'rgba(30,215,96,0.08)' : '#1f1f1f',
            border: amountChanged ? '1px solid #1ed760' : '1px solid #2a2a2a',
            borderRadius:8, padding:14,
          }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10, gap:10, flexWrap:'wrap' }}>
              <span className="eyebrow" style={{ color: amountChanged ? '#1ed760' : '#b3b3b3' }}>
                {amountChanged ? 'Cambio detectado' : 'Nota / Comentario'}
              </span>
              {amountChanged && (
                <span className="num" style={{ fontWeight:800, fontSize:14, color: diff>0?'#f3727f':'#1ed760' }}>
                  {diff>0?'+':''}{fmt(diff)}
                </span>
              )}
            </div>
            <label>
              {amountChanged ? 'Motivo del cambio' : 'Comentario'}
              <span style={{ color:'#7c7c7c', fontWeight:400, textTransform:'none', letterSpacing:0, marginLeft:6 }}>
                {amountChanged ? '(recomendado)' : '(opcional, se guarda en el historial)'}
              </span>
            </label>
            <textarea
              value={note}
              onChange={e => setNote(e.target.value)}
              placeholder={amountChanged ? 'Ej. Aumento por IPC, renegociación...' : 'Ej. Cambié la cuenta asociada, cambio de proveedor...'}
              rows={2}
              style={{ resize:'vertical' }}
              autoFocus={amountChanged}
            />
          </div>

          {history.length > 0 && (
            <details style={{ marginTop:4 }}>
              <summary style={{ cursor:'pointer', color:'#b3b3b3', fontSize:12, fontWeight:700, letterSpacing:1, textTransform:'uppercase', padding:'8px 0' }}>
                Historial de cambios ({history.length})
              </summary>
              <div style={{ marginTop:12, borderLeft:'2px solid #2a2a2a', paddingLeft:16, display:'flex', flexDirection:'column', gap:14 }}>
                {[...history].reverse().map((h, idx, arr) => {
                  const prev = arr[idx+1];
                  const d = prev ? h.amount - prev.amount : 0;
                  return (
                    <div key={h.id} style={{ position:'relative' }}>
                      <span style={{ position:'absolute', left:-22, top:4, width:10, height:10, borderRadius:'50%', background: idx===0 ? '#1ed760' : '#4d4d4d', border:'2px solid #181818' }}/>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8, flexWrap:'wrap' }}>
                        <div style={{ display:'flex', gap:8, alignItems:'baseline', flexWrap:'wrap' }}>
                          <span className="num" style={{ fontWeight:800, fontSize:14 }}>{fmt(h.amount)}</span>
                          {prev && d !== 0 && (
                            <span className="num" style={{ fontSize:11, fontWeight:700, color: d>0?'#f3727f':'#1ed760' }}>
                              ({d>0?'+':''}{fmt(d)})
                            </span>
                          )}
                        </div>
                        <span style={{ fontSize:11, color:'#7c7c7c' }}>{h.date}</span>
                      </div>
                      <div style={{ color:'#b3b3b3', fontSize:12, marginTop:3 }}>{h.note}</div>
                    </div>
                  );
                })}
              </div>
            </details>
          )}
        </div>
        <div style={{ display:'flex', gap:10, justifyContent:'flex-end', marginTop:24 }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>
    </div>
  );
}

        <p style={{ color:'#b3b3b3', fontSize:13, margin:'0 0 20px' }}>
          {view === 'm'
            ? 'Marca los recurrentes del mes. Se aplicarán a Q1 y Q2 automáticamente.'
            : 'Marca los que correspondan a esta quincena.'}
        </p>
        <div style={{ display:'flex', flexDirection:'column', gap:8, maxHeight:320, overflowY:'auto' }}>
          {recurrentes.map(r => (
            <label key={r.id} onClick={() => toggle(r.id)} style={{
              display:'flex', alignItems:'center', gap:12, padding:12, borderRadius:6, cursor:'pointer',
              background: sel[r.id] ? 'rgba(30,215,96,0.1)' : '#121212',
              border: `1px solid ${sel[r.id] ? '#1ed760' : '#2a2a2a'}`,
            }}>
              <input type="checkbox" checked={!!sel[r.id]} readOnly style={{ width:18, height:18, accentColor:'#1ed760' }}/>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:700, fontSize:14 }}>{r.desc}</div>
                <div style={{ fontSize:11, color:'#7c7c7c' }}>{r.cat} · {r.ref || 'sin ref'}</div>
              </div>
              <div className="num" style={{ fontWeight:800 }}>{fmt(r.amount)}</div>
            </label>
          ))}
        </div>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:20, padding:'14px 16px', background:'#121212', borderRadius:6 }}>
          <span style={{ color:'#b3b3b3', fontSize:12 }}>{selected.length} seleccionados</span>
          <span className="num" style={{ fontSize:18, fontWeight:800, color:'#1ed760' }}>{fmt(total)}</span>
        </div>
        <div style={{ display:'flex', gap:10, justifyContent:'flex-end', marginTop:20 }}>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={() => onApply(selected)} disabled={selected.length===0}>Aplicar {selected.length>0?`(${selected.length})`:''}</button>
        </div>
      </div>
    </div>
  );
}

function ConfigScreen({ year, data, onClearYear, onClearItems, onClearAll, onResetDemo }) {
  const [confirm, setConfirm] = React.useState(null);

  const stats = React.useMemo(() => {
    const keys = Object.keys(data);
    const yearKeys = keys.filter(k => k.startsWith(`${year}_`));
    const allItems = Object.values(data).flatMap(d => d.items || []);
    const yearItems = yearKeys.flatMap(k => data[k].items || []);
    return {
      periods: keys.length,
      yearPeriods: yearKeys.length,
      items: allItems.length,
      yearItems: yearItems.length,
    };
  }, [data, year]);

  const actions = [
    {
      id:'items', title:'Eliminar todos los gastos',
      desc:'Borra todos los movimientos pero conserva ingresos, presupuestos y configuración.',
      btn:'Eliminar gastos', count:`${stats.items} gastos`, danger:false, onRun:onClearItems,
    },
    {
      id:'year', title:`Eliminar datos del año ${year}`,
      desc:`Borra ingresos, gastos y periodos del año ${year} únicamente. Los demás años no se tocan.`,
      btn:`Eliminar ${year}`, count:`${stats.yearPeriods} periodos · ${stats.yearItems} gastos`,
      danger:true, onRun:onClearYear,
    },
    {
      id:'all', title:'Eliminar todos los datos',
      desc:'Borra absolutamente todo: periodos, gastos, recurrentes. No hay vuelta atrás.',
      btn:'Eliminar todo', count:`${stats.periods} periodos · ${stats.items} gastos`,
      danger:true, onRun:onClearAll,
    },
    {
      id:'reset', title:'Restaurar datos demo',
      desc:'Vuelve al estado inicial con los datos de ejemplo. Útil para probar la app.',
      btn:'Restaurar demo', count:'Sobrescribe todo', danger:false, onRun:onResetDemo,
    },
  ];

  const MiniStat = ({ label, value }) => (
    <div className="card" style={{ padding:16 }}>
      <div className="eyebrow" style={{ color:'#7c7c7c', fontSize:10 }}>{label}</div>
      <div className="num" style={{ fontSize:32, fontWeight:800, color:'#fff', letterSpacing:'-0.5px', marginTop:4 }}>{value}</div>
    </div>
  );

  return (
    <div className="content">
      <div>
        <div className="eyebrow" style={{ color:'#1ed760' }}>Config</div>
        <h1 style={{ fontSize:48, fontWeight:800, letterSpacing:'-1.5px', margin:'8px 0 12px' }}>Configuración</h1>
        <p style={{ color:'#b3b3b3', fontSize:14, maxWidth:600, margin:0 }}>Gestiona tus datos. Las acciones de limpieza son irreversibles, úsalas con cuidado.</p>
      </div>

      <div className="card">
        <h2 style={{ fontSize:18, fontWeight:700, margin:'0 0 6px' }}>Datos almacenados</h2>
        <p style={{ color:'#7c7c7c', fontSize:12, margin:'0 0 16px' }}>Resumen de lo que hay guardado en esta sesión.</p>
        <div className="grid-4">
          <MiniStat label="Periodos totales" value={stats.periods}/>
          <MiniStat label={`Periodos ${year}`} value={stats.yearPeriods}/>
          <MiniStat label="Gastos totales" value={stats.items}/>
          <MiniStat label={`Gastos ${year}`} value={stats.yearItems}/>
        </div>
      </div>

      <div className="card">
        <h2 style={{ fontSize:18, fontWeight:700, margin:'0 0 6px' }}>Zona de limpieza</h2>
        <p style={{ color:'#7c7c7c', fontSize:12, margin:'0 0 20px' }}>Cada acción pide confirmación antes de ejecutarse.</p>
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {actions.map(a => (
            <div key={a.id} style={{
              display:'flex', alignItems:'center', justifyContent:'space-between', gap:16,
              padding:16, background:'#1f1f1f', borderRadius:8,
              border: a.danger ? '1px solid rgba(243,114,127,0.25)' : '1px solid #2a2a2a',
            }}>
              <div style={{ minWidth:0, flex:1 }}>
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:4, flexWrap:'wrap' }}>
                  <span style={{ fontSize:14, fontWeight:700, color:'#fff' }}>{a.title}</span>
                  <span style={{ fontSize:10, fontWeight:700, letterSpacing:1.2, textTransform:'uppercase', color: a.danger ? '#f3727f' : '#7c7c7c' }}>
                    {a.count}
                  </span>
                </div>
                <div style={{ color:'#b3b3b3', fontSize:12, lineHeight:1.5 }}>{a.desc}</div>
              </div>
              <button
                className="btn"
                onClick={() => setConfirm(a)}
                style={{
                  background: a.danger ? 'transparent' : '#fff',
                  color: a.danger ? '#f3727f' : '#121212',
                  border: a.danger ? '1px solid #f3727f' : 'none',
                  flexShrink:0,
                }}
              >{a.btn}</button>
            </div>
          ))}
        </div>
      </div>

      {confirm && (
        <div className="overlay" onClick={() => setConfirm(null)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth:440 }}>
            <div style={{
              width:48, height:48, borderRadius:'50%',
              background: confirm.danger ? 'rgba(243,114,127,0.15)' : 'rgba(30,215,96,0.15)',
              color: confirm.danger ? '#f3727f' : '#1ed760',
              display:'flex', alignItems:'center', justifyContent:'center', marginBottom:16,
            }}>
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            </div>
            <h2 style={{ fontSize:20, fontWeight:800, margin:'0 0 8px' }}>{confirm.title}</h2>
            <p style={{ color:'#b3b3b3', fontSize:13, margin:'0 0 24px', lineHeight:1.5 }}>
              {confirm.desc} {confirm.danger && <strong style={{ color:'#f3727f' }}>Esta acción no se puede deshacer.</strong>}
            </p>
            <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
              <button className="btn btn-ghost" onClick={() => setConfirm(null)}>Cancelar</button>
              <button
                className="btn"
                onClick={() => { confirm.onRun(); setConfirm(null); }}
                style={{
                  background: confirm.danger ? '#f3727f' : '#1ed760',
                  color:'#121212',
                }}
              >{confirm.btn}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
