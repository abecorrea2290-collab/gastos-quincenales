<title>Control de Gastos v1.2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#000;--surface:#121212;--surface2:#181818;--surface3:#1f1f1f;
  --border:#2a2a2a;--border2:#333;
  --text:#fff;--text2:#b3b3b3;--text3:#7c7c7c;
  --accent:#1ed760;--accent2:#1fdf64;--accent-light:rgba(30,215,96,0.12);
  --danger:#f3727f;--danger-light:rgba(243,114,127,0.1);
  --warning:#ffa42b;--warning-light:rgba(255,164,43,0.1);
  --info:#539df5;--info-light:rgba(83,157,245,0.1);
  --purple:#a29bfe;--purple-light:rgba(162,155,254,0.1);
  --teal:#00cec9;--teal-light:rgba(0,206,201,0.1);
  --radius:8px;--radius-sm:4px;--shadow:0 4px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── SHELL ─────────────────────────────────────────────────────── */
.app-shell{display:flex;min-height:100vh;background:var(--bg)}

/* ── SIDEBAR ───────────────────────────────────────────────────── */
.sb{width:236px;background:#000;padding:20px 12px;display:flex;flex-direction:column;gap:16px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:10px;padding:4px 10px}
.sb-logo-icon{width:44px;height:44px;border-radius:10px;flex-shrink:0}
.sb-logo-name{font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
.sb-nav{background:var(--surface);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:2px}
.sb-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;color:var(--text2);font-size:13px;cursor:pointer;transition:color 120ms,background 120ms;font-weight:500;border:none;background:transparent;width:100%;text-align:left}
.sb-item:hover{color:#fff;background:rgba(255,255,255,0.05)}
.sb-item.active{color:#fff;background:rgba(255,255,255,0.08);font-weight:700}
.sb-item svg{flex-shrink:0}
.sb-footer{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.sb-user{display:flex;align-items:center;gap:8px;padding:10px 10px;background:var(--surface);border-radius:8px}
.sb-user-name{font-size:12px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── BOTTOM NAV (mobile) ────────────────────────────────────────── */
.bottom-nav{display:none}

/* ── MAIN AREA ──────────────────────────────────────────────────── */
.main-area{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a1a1a 0%,#121212 300px,#000 100%);min-width:0;overflow-x:hidden}

/* ── SYNC BAR ───────────────────────────────────────────────────── */
.sync-bar{background:rgba(0,0,0,0.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:6px 24px;display:flex;align-items:center;gap:8px;font-size:11px;min-height:28px;position:sticky;top:0;z-index:100}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-dot.ok{background:var(--accent)}.sync-dot.syncing{background:var(--warning);animation:pulse 1s infinite}
.sync-dot.err{background:var(--danger)}.sync-dot.idle{background:var(--text3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#sync-label{font-weight:600;color:var(--text2);font-size:11px}
#sync-time{margin-left:auto;color:var(--text3);font-size:10px}

/* ── TOPBAR ─────────────────────────────────────────────────────── */
.topbar{padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(0,0,0,0.4);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.tabs-pill-wrap{display:inline-flex;background:var(--surface2);border-radius:500px;padding:3px;gap:2px}
.tabs-pill-wrap button{background:transparent;border:none;padding:6px 16px;border-radius:500px;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all 150ms}
.tabs-pill-wrap button.active{background:#fff;color:#121212}
.ynav-inline{display:flex;align-items:center;gap:4px}
.ynav-inline button{background:transparent;border:1px solid var(--border2);border-radius:500px;padding:5px 12px;cursor:pointer;color:var(--text);font-size:13px;font-weight:700;min-height:30px;font-family:inherit;transition:border-color 120ms}
.ynav-inline button:hover{border-color:var(--text)}
#yd{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;min-width:42px;text-align:center}
.view-tab-dash{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border2);border-radius:500px;padding:6px 14px;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);white-space:nowrap;transition:all .15s;font-family:inherit}
.view-tab-dash:hover,.view-tab-dash.active{color:var(--accent);border-color:var(--accent)}

/* ── BUDGET ALERT BAR ───────────────────────────────────────────── */
#budget-alert{border-left:none}
.budget-alert{padding:10px 24px;font-size:12px;display:flex;align-items:center;gap:8px;font-weight:600;border-left:3px solid}
@keyframes slideIn{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── PERIOD TABS ────────────────────────────────────────────────── */
.tabs{display:flex;overflow-x:auto;padding:8px 16px;gap:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:transparent}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:var(--surface2);border:1px solid transparent;color:var(--text2);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:80px;transition:all 150ms}
.tab:hover{background:var(--surface3);color:#fff}
.tab.past{opacity:0.5}
.tab.active-period{border-color:var(--accent-light);color:var(--accent)}
.tab.active,.tab.active:hover{background:var(--accent);color:#121212;border-color:var(--accent)}
.tab-name{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tab-date{font-size:10px;opacity:.75}
.tab.active .tab-date,.tab.active:hover .tab-date{opacity:.85;color:#121212}

/* ── MAIN CONTENT ───────────────────────────────────────────────── */
.main{padding:16px 24px 40px;max-width:960px;margin:0 auto;width:100%}
#dash-body{padding-top:0}

/* ── CARDS ──────────────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:520px){.cards{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.cards{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);padding:14px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--radius) var(--radius) 0 0;background:var(--card-accent,var(--border))}
.card.c-green{--card-accent:var(--accent)}.card.c-blue{--card-accent:var(--info)}.card.c-red{--card-accent:var(--danger)}.card.c-orange{--card-accent:var(--warning)}.card.c-purple{--card-accent:var(--purple)}
.clbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:6px}
.cval{font-size:16px;font-weight:800;line-height:1.2;word-break:break-all;font-variant-numeric:tabular-nums}
.cval.green{color:var(--accent)}.cval.red{color:var(--danger)}.cval.blue{color:var(--info)}.cval.orange{color:var(--warning)}
.csub{font-size:10px;color:var(--text3);margin-top:4px}
.pbar{background:var(--border);border-radius:2px;height:4px;margin-top:6px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s}

/* ── SECTIONS ───────────────────────────────────────────────────── */
.sec{background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.sec-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.sec-title{font-size:13px;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px}
.sec-body{padding:14px 16px}

/* ── FORMS ──────────────────────────────────────────────────────── */
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.fg input,.fg select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:14px;background:var(--surface);color:#fff;outline:none;-webkit-appearance:none;min-height:40px;font-family:inherit;transition:border-color 150ms}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.fg input::placeholder{color:var(--text3)}
.fg.grow{flex:1;min-width:120px}.fg.wsm input{width:110px}.fg.wmd input{width:140px}.fg.wref input{width:120px}
@media(max-width:600px){.form{flex-direction:column}.fg,.fg.wsm,.fg.wmd,.fg.wref{width:100%}.fg.wsm input,.fg.wmd input,.fg.wref input{width:100%}}

/* ── BUTTONS ────────────────────────────────────────────────────── */
.btn{border:none;border-radius:500px;padding:9px 18px;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;transition:transform 120ms,background 150ms,border-color 150ms;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;min-height:38px;-webkit-tap-highlight-color:transparent;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:#121212}.btn-p:hover{background:var(--accent2)}
.btn-d{background:transparent;color:var(--danger);border:1px solid var(--danger)}.btn-d:hover{background:var(--danger);color:#fff}
.btn-w{background:transparent;color:var(--warning);border:1px solid var(--warning)}.btn-w:hover{background:var(--warning);color:#fff}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-g:hover{color:#fff;border-color:var(--text2)}
.btn-t{background:transparent;color:var(--teal);border:1px solid var(--teal)}.btn-t:hover{background:var(--teal);color:#fff}
.btn-dash{background:transparent;color:var(--purple);border:1px solid var(--purple);font-weight:800}.btn-dash:hover{background:var(--purple);color:#fff}
.bsm{padding:5px 12px;font-size:10px;min-height:30px;letter-spacing:1px}

/* ── TABLE ──────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:460px}
th{text-align:left;padding:9px 10px;color:var(--text3);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;font-size:12px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface3)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:500px;font-size:10px;font-weight:700}
.b-rec{background:var(--info-light);color:var(--info)}.b-cat{background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.cc{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;flex-shrink:0}

/* ── COP AMOUNTS ────────────────────────────────────────────────── */
.cop{display:inline-flex;align-items:baseline;gap:1px;font-variant-numeric:tabular-nums}
.cop-sym{font-size:.78em;font-weight:700;opacity:.7}
.cop-num{font-weight:800;letter-spacing:-.4px}
.amt-red .cop-sym,.amt-red .cop-num{color:var(--danger)}
.amt-green .cop-sym,.amt-green .cop-num{color:var(--accent)}
.amt-blue .cop-sym,.amt-blue .cop-num{color:var(--info)}
.amt-orange .cop-sym,.amt-orange .cop-num{color:var(--warning)}
.amt-muted .cop-sym,.amt-muted .cop-num{color:var(--text2)}
.amt-cell{text-align:right}

/* ── BANNERS ────────────────────────────────────────────────────── */
.banner{border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:7px;line-height:1.5}
.ban-i{background:var(--info-light);border:1px solid rgba(83,157,245,.3);color:var(--info)}
.ban-w{background:var(--warning-light);border:1px solid rgba(255,164,43,.3);color:var(--warning)}

/* ── PAY BOX ────────────────────────────────────────────────────── */
.pay-box{background:var(--purple-light);border:1px solid rgba(162,155,254,.25);border-radius:var(--radius-sm);padding:12px 16px;color:var(--purple);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.pay-box-left .pd-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;font-weight:700;opacity:.7;margin-bottom:1px}
.pay-box-left strong{font-size:13px;font-weight:800;display:block}
.pay-badge{font-size:11px;font-weight:700;background:var(--purple);color:#fff;padding:4px 12px;border-radius:500px;white-space:nowrap;letter-spacing:.5px}

/* ── TOGGLE ─────────────────────────────────────────────────────── */
.tog-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2)}
.tog{position:relative;width:38px;height:22px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.sldr{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:.2s}
.sldr:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input:checked+.sldr{background:var(--accent)}
input:checked+.sldr:before{transform:translateX(16px)}

/* ── VIEW TOGGLE (Quincenal/Mensual) ────────────────────────────── */
.view-toggle-wrap{display:flex;align-items:center;gap:8px;flex:1}
.vtog-label{font-size:12px;font-weight:700;color:var(--text3);transition:color .2s;white-space:nowrap}
.vtog-label.active{color:var(--accent)}
.vtog{position:relative;width:44px;height:24px;flex-shrink:0;cursor:pointer}
.vtog input{opacity:0;width:0;height:0}
.vtog-sldr{position:absolute;inset:0;background:var(--accent);border-radius:24px;transition:.25s;cursor:pointer}
.vtog-sldr:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.vtog input:checked+.vtog-sldr:before{transform:translateX(20px)}

/* ── INCOME DISPLAY ─────────────────────────────────────────────── */
.income-display{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 14px;background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border)}
.income-row{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}

/* ── CHARTS ─────────────────────────────────────────────────────── */
.chart-wrap{position:relative;width:100%}
.empty{text-align:center;padding:20px;color:var(--text3);font-size:12px}

/* ── MODALS ──────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:999;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.overlay{align-items:center;padding:16px}}
.modal{background:var(--surface2);border-radius:12px 12px 0 0;padding:22px;width:100%;box-shadow:0 -4px 32px rgba(0,0,0,.5);max-height:92vh;overflow-y:auto;border:1px solid var(--border)}
@media(min-width:640px){.modal{border-radius:12px;max-height:90vh}}
.modal-sm{max-width:440px}.modal-lg{max-width:620px}
.modal-drag{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px}
@media(min-width:640px){.modal-drag{display:none}}
.modal h3{font-size:16px;font-weight:800;margin-bottom:6px;color:#fff}
.modal .sub{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* ── RECURRENTES MODAL ───────────────────────────────────────────── */
.rec-grid{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rec-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);cursor:pointer;background:var(--surface)}
.rec-item.selected{border-color:var(--accent);background:var(--accent-light)}
.rec-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.rec-item-info{flex:1;min-width:0}
.rec-item-name{font-weight:700;font-size:13px;color:#fff}
.rec-item-cat{font-size:11px;color:var(--text3);margin-top:1px}
.rec-sel-total{background:var(--surface);border-radius:var(--radius-sm);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;border:1px solid var(--border)}
.sel-bar{display:flex;gap:7px;margin-bottom:8px;align-items:center}
.sel-bar span{font-size:11px;color:var(--text3);flex:1}

/* ── HISTORY ITEMS ───────────────────────────────────────────────── */
.hist-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px}
.hist-item:last-child{border-bottom:none}
.hist-date{font-size:10px;color:var(--text3);margin-bottom:2px}

/* ── TOAST ───────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#121212;padding:11px 22px;border-radius:500px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:fadeup .3s ease;white-space:nowrap;max-width:90vw}
.toast.warn{background:var(--warning);color:#121212}.toast.err{background:var(--danger);color:#fff}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── SPINNER ─────────────────────────────────────────────────────── */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── HEADER ELEMENTS ─────────────────────────────────────────────── */
.h1{display:none}/* Hidden — moved to sidebar */
.hdr-r{display:none}/* Hidden — moved to sidebar */
.ver-badge{font-size:10px;background:var(--accent);color:#121212;padding:2px 8px;border-radius:500px;font-weight:800;letter-spacing:.5px}
.user-chip{display:none}/* Hidden inline — shown in sidebar */
.user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-light)}
.user-initials{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#121212;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── DASHBOARD PANEL ─────────────────────────────────────────────── */
#dash-panel{background:transparent;min-height:60vh}
.dash-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:600px){.dash-cards{grid-template-columns:repeat(4,1fr)}}

/* ── CHANGELOG ───────────────────────────────────────────────────── */
.changelog-item{padding:14px 0;border-bottom:1px solid var(--border)}
.changelog-item:last-child{border-bottom:none}
.changelog-ver{font-size:14px;font-weight:800;color:var(--accent);margin-bottom:4px}
.changelog-date{font-size:10px;color:var(--text3);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.changelog-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.changelog-list li{font-size:12px;color:var(--text2);padding-left:16px;position:relative;line-height:1.5}
.changelog-list li::before{content:'·';position:absolute;left:5px;color:var(--accent);font-weight:800}

/* ── LOGIN ───────────────────────────────────────────────────────── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:16px;background:var(--bg)}
.login-card{background:var(--surface2);border-radius:12px;border:1px solid var(--border);padding:36px 28px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow)}
.login-logo{font-size:52px;margin-bottom:8px}
.login-title{font-size:24px;font-weight:800;color:var(--accent);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:28px;line-height:1.5}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-google:hover{background:var(--surface3);border-color:var(--text3)}
.google-icon{width:20px;height:20px;flex-shrink:0}
#app-screen{display:none}

/* ── RESPONSIVE ──────────────────────────────────────────────────── */
@media(max-width:860px){
  .sb{display:none}
  .main{padding:12px 14px 80px}
  .topbar{padding:10px 14px;gap:8px}
  .sync-bar{padding:5px 14px}
  .tabs{padding:6px 10px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,0.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:500;justify-content:space-around}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;background:none;border:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:8px;transition:color 120ms}
  .bn-item.active{color:var(--accent)}
  .view-toggle-wrap{flex:none}
}
@media(max-width:560px){
  .cards{grid-template-columns:1fr 1fr}
  .topbar > *{flex-shrink:1}
}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:3px solid transparent;background-clip:content-box}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">💰</div>
    <div class="login-title">Control de Gastos</div>
    <div class="login-sub">Tus finanzas quincenales sincronizadas<br>en todos tus dispositivos</div>
    <button class="btn-google" onclick="loginGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar con Google
    </button>
    <div style="margin-top:16px;font-size:11px;color:var(--text3)">🔒 Solo tú puedes ver tus datos · Firebase Firestore</div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app-screen">
  <div class="app-shell">

    <!-- SIDEBAR (desktop) -->
    <aside class="sb">
      <div class="sb-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" class="sb-logo-icon"><circle cx="28" cy="28" r="24" fill="#1ed760"/><path d="M21 20 C21 16.7,23.7 14,27 14 L34 14 C37.3 14,40 16.7,40 20 L40 22 L34 22 L34 20 L27 20 L27 36 L34 36 L34 32 L30 32 L30 28 L40 28 L40 36 C40 39.3,37.3 42,34 42 L27 42 C23.7 42,21 39.3,21 36 Z" fill="#121212"/></svg>
        <span class="sb-logo-name">Gastos <span class="ver-badge">v1.2.0</span></span>
      </div>
      <nav class="sb-nav">
        <button class="sb-item active" id="sbnav-q" onclick="sbNav('q')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Panel
        </button>
        <button class="sb-item" id="sbnav-dash" onclick="sbNav('dash')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16V9m5 7V5m5 11v-4"/></svg>
          Resumen anual
        </button>
        <button class="sb-item" id="sbnav-cats" onclick="showCats()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
          Categorías
        </button>
        <button class="sb-item" id="sbnav-clean" onclick="showClean()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Configuración
        </button>
        <button class="sb-item" id="sbnav-log" onclick="showChangelog()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
          Notas de versión
        </button>
      </nav>
      <div class="sb-footer">
        <div class="sb-user">
          <div class="user-initials" id="user-initials">?</div>
          <span class="sb-user-name" id="user-name">...</span>
          <button class="btn btn-g bsm" onclick="logout()" title="Cerrar sesión" style="padding:5px 10px;flex-shrink:0">↩</button>
        </div>
        <div id="sync-status-sb" style="display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;color:var(--text3)">
          <div class="sync-dot idle" id="sync-dot-sb"></div>
          <span id="sync-label-sb">Conectando…</span>
        </div>
      </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="main-area">

      <!-- SYNC BAR (mobile — hidden on desktop since sidebar has it) -->
      <div class="sync-bar" style="display:none" id="sync-bar-mobile">
        <div class="sync-dot idle" id="sync-dot"></div>
        <span id="sync-label">Conectando…</span>
        <span id="sync-time"></span>
      </div>

      <!-- BUDGET ALERT -->
      <div id="budget-alert" style="display:none"></div>

      <!-- TOPBAR -->
      <div class="topbar">
        <div class="view-toggle-wrap">
          <span class="vtog-label" id="vtog-left">Quincenal</span>
          <label class="vtog">
            <input type="checkbox" id="vtog-input" onchange="toggleViewMode(this.checked)">
            <span class="vtog-sldr"></span>
          </label>
          <span class="vtog-label" id="vtog-right">Mensual</span>
        </div>
        <button class="view-tab-dash" id="vtab-d" onclick="setViewTab('d')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16V9m5 7V5m5 11v-4"/></svg>
          Resumen
        </button>
        <div class="ynav-inline" id="ynav-inline">
          <button onclick="changeYear(-1)">&#8592;</button>
          <span id="yd"></span>
          <button onclick="changeYear(1)">&#8594;</button>
        </div>
      </div>

      <!-- PERIOD TABS -->
      <div class="tabs" id="tabs"></div>
      <div id="budget-warn-bar" style="display:none"></div>

      <!-- MAIN CONTENT -->
      <div class="main" id="content"></div>

      <!-- DASHBOARD PANEL -->
      <div id="dash-panel" style="display:none">
        <div class="main" style="max-width:960px;margin:0 auto;padding:16px 24px 8px">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
            <span style="font-size:15px;font-weight:800;color:var(--accent)">Resumen Anual</span>
            <div style="display:flex;align-items:center;gap:8px">
              <select id="dash-month" onchange="renderDash()" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:13px;background:var(--surface);color:var(--text);font-weight:700;font-family:inherit"></select>
              <button class="btn btn-g bsm" onclick="setViewTab('q')">✕ Cerrar</button>
            </div>
          </div>
        </div>
        <div class="main" id="dash-body" style="padding-top:0"></div>
      </div>

    </div><!-- /.main-area -->
  </div><!-- /.app-shell -->

const emptyP=()=>({income:0,extraIncome:[],items:[],transferIn:0,transferLabel:'',closed:false});

async function getPeriodo(y,m,q){
  const k=cacheKey(y,m,q);
  if(cache[k])return cache[k];
  setSyncStatus('syncing','Cargando…');
  try{
    const snap=await getDoc(doc(db,periodoRef(y,m,q)));
    const data=snap.exists()?snap.data():emptyP();
    if(!data.extraIncome)data.extraIncome=[];
    cache[k]=data;
    setSyncStatus('ok','Sincronizado');
    return data;
  }catch(e){setSyncStatus('err','Sin conexión');return emptyP();}
}

async function savePeriodo(y,m,q,data){
  if(!checkRateLimit()) return;
  cache[cacheKey(y,m,q)]=data;
  setSyncStatus('syncing','Guardando…');
  try{await setDoc(doc(db,periodoRef(y,m,q)),{...data,updatedAt:serverTimestamp()});setSyncStatus('ok','Guardado');}
  catch(e){setSyncStatus('err','Error al guardar');}
}

function fmtCOP(n,cls=''){
  const neg=n<0;
  const miles=Math.abs(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return `<span class="cop${cls?' '+cls:''}">${neg?'<span class="cop-sym">−</span>':''}<span class="cop-sym">$\u202F</span><span class="cop-num">${miles}</span></span>`;
}
function fmtPlain(n){return '$ '+Math.abs(n).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}

const isFst=d=>FEST.includes(`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
function prevBD(d){let t=new Date(d);t.setDate(t.getDate()-1);while(isWE(t)||isFst(t))t.setDate(t.getDate()-1);return t;}
function payDate(y,m,q){
  let raw=q===1?new Date(y,m,15):(()=>{const l=new Date(y,m+1,0).getDate();return new Date(y,m,l===31?30:l);})();
  if(isWE(raw)||isFst(raw))raw=prevBD(raw);return raw;
}

window.loginGoogle=async()=>{
  try{
    const provider=new GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    // Intentar popup primero, redirect como fallback
    try{
      await signInWithPopup(auth,provider);
    }catch(popupErr){
      if(['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(popupErr.code)){
        await signInWithRedirect(auth,provider);
      } else { throw popupErr; }
    }
  }catch(e){
    if(e.code!=='auth/cancelled-popup-request')
      toast('Error al iniciar: '+e.message,'err');
  }
};

// Limpia el transferIn de quincenas que no tienen ingreso registrado
// Corrige datos históricos guardados con la lógica automática anterior
async function limpiarSobrantesHuerfanos(y){
  let limpiados=0;
  for(const[mi] of MN.entries()){
    for(const q of [1,2]){
      try{
        const d=await getPeriodo(y,mi,q);
        if((!d.income||d.income===0) && d.transferIn>0){
          d.transferIn=0;
          d.transferLabel='';
          await savePeriodo(y,mi,q,d);
          limpiados++;
        }
      }catch(e){}
    }
  }
  if(limpiados>0) toast(`🧹 ${limpiados} sobrante${limpiados!==1?'s':''} huérfano${limpiados!==1?'s':''} eliminado${limpiados!==1?'s':''}`);
}

// Quincena base según día del mes (sin Firebase)
function getActivePeriod(){
  const now=new Date();
  const d=now.getDate(), m=now.getMonth(), y=now.getFullYear();
  let result;
  if(d<=15){ if(m===0) result={y:y-1,m:11,q:2}; else result={y,m:m-1,q:2}; }
  else { result={y,m,q:1}; }
  if(result.y<MIN_YEAR) result={y:MIN_YEAR,m:0,q:1};
  return result;
}

function prevQ(y,m,q){if(q===2)return{y,m,q:1};if(m===0)return{y:y-1,m:11,q:2};return{y,m:m-1,q:2};}

  try{
    const d=await getPeriodo(base.y,base.m,base.q);
    // Si la quincena base está cerrada → pasar a la siguiente
    if(d.closed){
      const next=base.q===1?{y:base.y,m:base.m,q:2}:
        base.m===11?{y:base.y+1,m:0,q:1}:{y:base.y,m:base.m+1,q:1};
      return next;
    }
    // Si tiene ingreso y no está cerrada → es la activa
    if(d.income&&d.income>0) return base;
  }catch(e){}
  // Sin ingreso → la activa es la anterior
  const prev=prevQ(base.y,base.m,base.q);
  if(prev.y<MIN_YEAR) return base;
  return prev;
}

window.setViewTab=tab=>{

  if(isDash && viewMode==='d'){

window.changeYear=delta=>{

async function prevBalance(y,m,q){
  const p=prevQ(y,m,q);
  const d=await getPeriodo(p.y,p.m,p.q);
  // Solo transferir sobrante si la quincena anterior fue "abierta"
  // (tiene ingreso registrado), lo que significa que ya se cerró
  if(!d.income || d.income===0) return 0;
  const tIn=d.income+d.transferIn+(d.extraIncome||[]).reduce((a,i)=>a+i.amount,0);
  return Math.max(0,tIn-(d.items||[]).reduce((a,i)=>a+i.amount,0));
}

function renderTabs(){
  document.getElementById('yd').textContent=CY;
  const el=document.getElementById('tabs');el.innerHTML='';
  const now=new Date();now.setHours(0,0,0,0);
  // CP ya fue calculado por getActivePeriodFromDB en initApp — usarlo directamente
  const active=CP;

  if(viewMode==='q'){
    MN.forEach((mn,mi)=>[1,2].forEach(q=>{
      const pd=payDate(CY,mi,q);
      const isSelected=mi===CP.m&&q===CP.q;
      const isActualActive=CY===active.y&&mi===active.m&&q===active.q;

      let state='future';
      if(pd<now) state='past';
      if(isActualActive) state='active-period';

      const btn=document.createElement('button');
      btn.className='tab'+(isSelected?' active':state==='past'?' past':state==='active-period'?' active-period':' future');
      btn.innerHTML=`<span class="tab-name">${mn.slice(0,3)} Q${q}</span><span class="tab-date">Pago ${fmtD(pd)}</span>`;
      btn.onclick=()=>{CP={m:mi,q};renderTabs();};
      el.appendChild(btn);
    }));
  }else{
    MN.forEach((mn,mi)=>{
      const pdQ2=payDate(CY,mi,2);
      let state=pdQ2<now?'past':CY===active.y&&mi===active.m?'active-period':'future';
      const btn=document.createElement('button');
      btn.className='tab'+(mi===CP.m?' active':state==='past'?' past':state==='active-period'?' active-period':' future');
      btn.innerHTML=`<span class="tab-name">${mn}</span><span class="tab-date">${CY}</span>`;
      btn.onclick=()=>{CP={m:mi,q:1};renderTabs();};
      el.appendChild(btn);
    });
  }
  setTimeout(()=>{const a=el.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});},60);
  viewMode==='q'?renderMain():renderMonthly();
}

// Agregar gasto en vista mensual — detecta automáticamente la quincena según fecha
window._addItemMensual=async()=>{
  const ref=sanitize(document.getElementById('iref').value.trim());
  const desc=sanitize(document.getElementById('idesc').value.trim());
  const amount=parseFloat(document.getElementById('iamt').value)||0;
  const cat=document.getElementById('icat').value;
  const date=document.getElementById('idate').value;
  const rec=document.getElementById('irec').checked;
  if(!desc||!amount){toast('Completa descripción y valor','err');return;}
  if(amount>100000000){toast('Valor máximo: $ 100.000.000','err');return;}
  // Determinar quincena según fecha seleccionada
  const dia=new Date(date+'T12:00:00').getDate();
  const q=dia<=15?1:2;
  const{m}=CP;const y=CY;
  const d=await getPeriodo(y,m,q);
  d.items=d.items||[];
  d.items.push({id:Date.now(),ref,desc,amount,cat,date,recurring:rec});
  await savePeriodo(y,m,q,d);
  if(rec){const lista=await getRec();if(!lista.find(r=>r.desc===desc&&r.cat===cat)){lista.push({id:Date.now()+1,desc,amount,cat,ref,history:[]});await saveRec(lista);}}
  document.getElementById('iref').value='';document.getElementById('idesc').value='';document.getElementById('iamt').value='';document.getElementById('irec').checked=false;
  renderMonthly();
  toast(`✓ Gasto guardado en Q${q}`);
};

  if(!confirm(`¿Cerrar ${MN[CP.m]} Q${CP.q}? El saldo restante se transferirá al registrar el ingreso de la siguiente quincena.`)) return;
  const{m,q}=CP;const y=CY;
  const d=await getPeriodo(y,m,q);
  d.closed=true;
  await savePeriodo(y,m,q,d);
  // Pasar a la siguiente quincena automáticamente
  const next=q===1?{m,q:2}:{m:m===11?0:m+1,q:1};
  const nextY=q===2&&m===11?y+1:y;
  CP={m:next.m,q:next.q};
  CY=nextY;
  toast(`✅ ${MN[m]} Q${q} cerrada — ahora en ${MN[next.m]} Q${next.q}`);
  renderTabs();
};
window._setIncome=async()=>{
  const{m}=CP;const y=CY;
  const q=viewMode==='m'?mQSel:CP.q;
  const d=await getPeriodo(y,m,q);
  const nuevoIngreso=parseFloat(document.getElementById('ii').value)||0;
  const esPrimerIngreso=d.income===0&&nuevoIngreso>0;
  d.income=nuevoIngreso;
  // Al registrar ingreso por primera vez → cerrar anterior y transferir sobrante
  if(esPrimerIngreso){
    const p=prevQ(y,m,q);
    const dPrev=await getPeriodo(p.y,p.m,p.q);
    if(!dPrev.closed&&dPrev.income>0){dPrev.closed=true;await savePeriodo(p.y,p.m,p.q,dPrev);}
    const pb=await prevBalance(y,m,q);
    if(pb>0){d.transferIn=pb;d.transferLabel=`Sobrante ${MN[p.m]} Q${p.q}${p.y!==y?' '+p.y:''}`;}
  }
  await savePeriodo(y,m,q,d);
  viewMode==='m'?renderMonthly():renderMain();
  toast('✓ Ingreso guardado'+(esPrimerIngreso&&d.transferIn>0?` · Sobrante ${fmtPlain(d.transferIn)} transferido`:''));
};

function destroyCharts(){

function renderPie(items){
  // Acumular por categoría ignorando propiedades internas como _q
  const t={};
  CATS.forEach(c=>t[c]=0);
  items.forEach(i=>{ if(i.cat && i.amount) t[i.cat]=(t[i.cat]||0)+i.amount; });

  const labels=CATS.filter(c=>t[c]>0);
  const vals=labels.map(c=>t[c]);
  const colors=labels.map(c=>getCatColor(c));
  const total=vals.reduce((a,b)=>a+b,0);

  const leg=document.getElementById('cleg');
  if(!labels.length){if(leg)leg.innerHTML='<div class="empty">Sin datos de gastos</div>';return;}

  // Leyenda con porcentaje Y valor
  if(leg)leg.innerHTML=labels.map((l,i)=>`
    <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px">
      <span style="width:9px;height:9px;border-radius:2px;background:${colors[i]};flex-shrink:0"></span>
      <span style="flex:1;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span>
      <span style="font-size:11px;font-weight:800;color:var(--text);flex-shrink:0">${Math.round(vals[i]/total*100)}%</span>
      <span style="font-size:10px;color:var(--text3);flex-shrink:0;min-width:65px;text-align:right">${fmtPlain(vals[i])}</span>
    </div>`).join('');

  // Destruir chart anterior de forma segura y limpiar canvas
  const wrap=document.getElementById('cpie');if(!wrap)return;
  if(charts.pie){try{charts.pie.destroy();}catch(e){}charts.pie=null;}
  const parent=wrap.parentNode;
  const newCanvas=document.createElement('canvas');
  newCanvas.id='cpie';
  parent.replaceChild(newCanvas,wrap);

  charts.pie=new Chart(newCanvas,{
    type:'doughnut',
    data:{labels,datasets:[{data:vals,backgroundColor:colors,borderWidth:2,borderColor:'rgba(255,255,255,.15)',hoverBorderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>` ${c.label}: ${fmtPlain(c.raw)} (${Math.round(c.raw/total*100)}%)`}}}}
  });
}

window.renderDash=async()=>{
  const y=parseInt(document.getElementById('dash-month').value);
  const body=document.getElementById('dash-body');
  body.innerHTML=`<div style="padding:32px;text-align:center;color:var(--text3)">
    <div class="spinner" style="width:24px;height:24px;border-color:rgba(90,47,160,.2);border-top-color:var(--purple);margin:0 auto 10px"></div>
    Cargando ${y}… (24 quincenas)
  </div>`;

  // Leer las 24 quincenas del año en paralelo
  const promises=[];
  for(let mi=0;mi<12;mi++) for(const q of[1,2]) promises.push(getPeriodo(y,mi,q).then(d=>({mi,q,d})));
  const results=await Promise.all(promises);

  // Acumular datos anuales
  let totalIn=0, totalOut=0, totalItems=0, totalExtra=0;
  const catTotals={};  CATS.forEach(c=>catTotals[c]=0);
  const monthInc=new Array(12).fill(0);   // ingresos por mes
  const monthExp=new Array(12).fill(0);   // gastos por mes
  const monthSaldo=new Array(12).fill(0); // saldo por mes
  const qInc=[], qExp=[], qLabels=[];     // por quincena (24)
  const mesBest={mes:-1,saldo:-Infinity};
  const mesWorst={mes:-1,saldo:Infinity};

  results.forEach(({mi,q,d})=>{
    const items=d.items||[];
    const extra=(d.extraIncome||[]).reduce((a,i)=>a+i.amount,0);
    const inc=(d.income||0)+(d.transferIn||0)+extra;
    const exp=items.reduce((a,i)=>a+i.amount,0);
    items.forEach(i=>{ if(i.cat&&i.amount) catTotals[i.cat]=(catTotals[i.cat]||0)+i.amount; });
    totalIn+=inc; totalOut+=exp; totalItems+=items.length; totalExtra+=extra;
    monthInc[mi]+=inc; monthExp[mi]+=exp;
    qLabels.push(MN[mi].slice(0,3)+' Q'+q);
    qInc.push(inc); qExp.push(exp);
  });

  // Saldo por mes y mejor/peor mes
  MN.forEach((_,mi)=>{
    monthSaldo[mi]=monthInc[mi]-monthExp[mi];
    if(monthSaldo[mi]>mesBest.saldo){mesBest.saldo=monthSaldo[mi];mesBest.mes=mi;}
    if(monthSaldo[mi]<mesWorst.saldo&&monthInc[mi]>0){mesWorst.saldo=monthSaldo[mi];mesWorst.mes=mi;}
  });

  const bal=totalIn-totalOut;
  const pct=totalIn>0?Math.round(totalOut/totalIn*100):0;
  const promedioMes=totalOut/12;

  // Categorías con gasto, ordenadas de mayor a menor
  const catLabels=CATS.filter(c=>catTotals[c]>0).sort((a,b)=>catTotals[b]-catTotals[a]);
  const catVals=catLabels.map(c=>catTotals[c]);
  const catColors=catLabels.map(c=>getCatColor(c));
  const catTotal=catVals.reduce((a,b)=>a+b,0);

  destroyDashCharts();
  body.innerHTML=`

    <!-- KPIs anuales -->
    <div class="dash-cards" style="grid-template-columns:repeat(2,1fr)">
      <div class="card c-green">
        <div class="clbl">Total ingresos ${y}</div>
        <div class="cval">${fmtCOP(totalIn,'amt-green')}</div>
        <div class="csub">Incl. ${fmtPlain(totalExtra)} extras</div>
      </div>
      <div class="card c-red">
        <div class="clbl">Total gastos ${y}</div>
        <div class="cval">${fmtCOP(totalOut,'amt-red')}</div>
        <div class="csub">${totalItems} movimientos</div>
      </div>
      <div class="card ${bal>=0?'c-green':'c-red'}">
        <div class="clbl">Saldo neto ${y}</div>
        <div class="cval">${fmtCOP(bal,bal>=0?'amt-green':'amt-red')}</div>
        <div class="csub">${bal>=0?'Superávit anual':'Déficit anual'}</div>
      </div>
      <div class="card c-orange">
        <div class="clbl">Promedio mensual</div>
        <div class="cval">${fmtCOP(Math.round(promedioMes),'amt-orange')}</div>
        <div class="csub">Gasto promedio/mes</div>
      </div>
    </div>

    <!-- % anual -->
    <div class="card" style="margin-bottom:10px;--card-accent:${pct>BUDGET_ALERT?'var(--danger)':pct>BUDGET_WARN?'var(--warning)':'var(--info)'}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span class="clbl">% del ingreso anual consumido en gastos</span>
        <span style="font-size:16px;font-weight:800;color:${pct>BUDGET_ALERT?'var(--danger)':pct>BUDGET_WARN?'var(--warning)':'var(--info)'}">${pct}%</span>
      </div>
      <div class="pbar" style="height:8px"><div class="pfill" style="width:${Math.min(100,pct)}%;background:${pct>BUDGET_ALERT?'var(--danger)':pct>BUDGET_WARN?'var(--warning)':'var(--info)'}"></div></div>
    </div>

    ${pct>=BUDGET_ALERT?`<div style="background:var(--danger-light);border-left:4px solid var(--danger);padding:10px 14px;border-radius:6px;font-size:12px;font-weight:600;color:var(--danger);margin-bottom:10px">🚨 Año ${y}: consumiste el ${pct}% de tus ingresos</div>`:''}

    <!-- Mejor y peor mes -->
    ${mesBest.mes>=0&&mesWorst.mes>=0?`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
      <div style="background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:10px;text-align:center">
        <div style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700;margin-bottom:3px">🏆 Mejor mes</div>
        <div style="font-size:14px;font-weight:800;color:var(--accent)">${MN[mesBest.mes]}</div>
        <div style="font-size:11px;color:var(--accent);margin-top:2px">${fmtPlain(mesBest.saldo)} de saldo</div>
      </div>
      <div style="background:var(--danger-light);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:10px;text-align:center">
        <div style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--danger);font-weight:700;margin-bottom:3px">⚠️ Mes más ajustado</div>
        <div style="font-size:14px;font-weight:800;color:var(--danger)">${MN[mesWorst.mes]}</div>
        <div style="font-size:11px;color:var(--danger);margin-top:2px">${fmtPlain(mesWorst.saldo)} de saldo</div>
      </div>
    </div>`:''}

    <!-- Gráfico de barras mensual: ingresos vs gastos -->
    <div class="sec">
      <div class="sec-hdr"><span class="sec-title" style="font-size:12px">📈 Ingresos vs Gastos por mes — ${y}</span></div>
      <div class="sec-body">
        <div class="chart-wrap" style="height:220px"><canvas id="dash-bar-mes"></canvas></div>
      </div>
    </div>

    <!-- Gráfico de línea: saldo mensual -->
    <div class="sec">
      <div class="sec-hdr"><span class="sec-title" style="font-size:12px">📉 Saldo mensual — ${y}</span></div>
      <div class="sec-body">
        <div class="chart-wrap" style="height:160px"><canvas id="dash-line-saldo"></canvas></div>
      </div>
    </div>

    <!-- Dona + leyenda categorías -->
    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title" style="font-size:12px">🍩 Distribución anual por categoría</span>
        <span style="font-size:10px;color:var(--text3)">${catLabels.length} categorías</span>
      </div>
      <div class="sec-body">
        <div style="display:grid;grid-template-columns:minmax(0,180px) 1fr;gap:14px;align-items:flex-start">
          <div class="chart-wrap" style="height:180px"><canvas id="dash-pie"></canvas></div>
          <div style="display:flex;flex-direction:column;gap:5px">
            ${catLabels.map((l,i)=>`
              <div>
                <div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">
                  <span style="width:9px;height:9px;border-radius:2px;background:${catColors[i]};flex-shrink:0"></span>
                  <span style="flex:1;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span>
                  <span style="font-size:11px;font-weight:800;color:var(--text);flex-shrink:0">${Math.round(catVals[i]/catTotal*100)}%</span>
                  <span style="font-size:10px;color:var(--text3);min-width:68px;text-align:right">${fmtPlain(catVals[i])}</span>
                </div>
                <div style="background:var(--surface2);border-radius:3px;height:4px;overflow:hidden">
                  <div style="height:100%;border-radius:3px;background:${catColors[i]};width:${Math.round(catVals[i]/catTotal*100)}%"></div>
                </div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <!-- Barras horizontales por categoría -->
    <div class="sec">
      <div class="sec-hdr"><span class="sec-title" style="font-size:12px">📊 Gasto total por categoría — ${y}</span></div>
      <div class="sec-body">
        <div class="chart-wrap" style="height:${Math.max(200,catLabels.length*32+60)}px"><canvas id="dash-bar-cat"></canvas></div>
      </div>
    </div>

    <!-- Resumen por mes tabla -->
    <div class="sec">
      <div class="sec-hdr"><span class="sec-title" style="font-size:12px">📋 Resumen por mes</span></div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Mes</th><th style="text-align:right">Ingresos</th><th style="text-align:right">Gastos</th><th style="text-align:right">Saldo</th><th style="text-align:right">%</th></tr></thead>
          <tbody>
          ${MN.map((mn,mi)=>{
            const inc=monthInc[mi], exp=monthExp[mi], sal=monthSaldo[mi];
            const p=inc>0?Math.round(exp/inc*100):0;
            if(inc===0&&exp===0) return '';
            return `<tr>
              <td style="font-weight:600">${mn}</td>
              <td class="amt-cell">${fmtCOP(inc,'amt-green')}</td>
              <td class="amt-cell">${fmtCOP(exp,'amt-red')}</td>
              <td class="amt-cell">${fmtCOP(sal,sal>=0?'amt-green':'amt-red')}</td>
              <td style="text-align:right;font-size:11px;font-weight:700;color:${p>BUDGET_ALERT?'var(--danger)':p>BUDGET_WARN?'var(--warning)':'var(--info)'}">${p}%</td>
            </tr>`;
          }).join('')}
          <tr style="border-top:2px solid var(--border)">
            <td style="font-weight:800">TOTAL ${y}</td>
            <td class="amt-cell"><strong>${fmtCOP(totalIn,'amt-green')}</strong></td>
            <td class="amt-cell"><strong>${fmtCOP(totalOut,'amt-red')}</strong></td>
            <td class="amt-cell"><strong>${fmtCOP(bal,bal>=0?'amt-green':'amt-red')}</strong></td>
            <td style="text-align:right;font-weight:800;color:${pct>BUDGET_ALERT?'var(--danger)':pct>BUDGET_WARN?'var(--warning)':'var(--info)'}">${pct}%</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>`;

  // ── GRÁFICO 1: Barras mensuales ingresos vs gastos ──
  const ctxMes=document.getElementById('dash-bar-mes');
  if(ctxMes){
    dashCharts.barMes=new Chart(ctxMes,{type:'bar',
      data:{labels:MN.map(m=>m.slice(0,3)),datasets:[
        {label:'Ingresos',data:monthInc,backgroundColor:'rgba(30,107,69,.75)',borderRadius:4,borderSkipped:false},
        {label:'Gastos',data:monthExp,backgroundColor:'rgba(184,15,26,.75)',borderRadius:4,borderSkipped:false}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:true,position:'top',labels:{font:{size:10},padding:10,boxWidth:8,usePointStyle:true}},
          tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmtPlain(c.raw)}`}}},
        scales:{x:{ticks:{font:{size:10}},grid:{display:false}},
          y:{ticks:{callback:v=>'$'+(v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v),font:{size:9}},
            grid:{color:'rgba(128,128,128,.1)'}}}}});
  }

  // ── GRÁFICO 2: Línea saldo mensual ──
  const ctxSaldo=document.getElementById('dash-line-saldo');
  if(ctxSaldo){
    const saldoColors=monthSaldo.map(s=>s>=0?'rgba(30,107,69,.8)':'rgba(184,15,26,.8)');
    dashCharts.lineSaldo=new Chart(ctxSaldo,{type:'bar',
      data:{labels:MN.map(m=>m.slice(0,3)),datasets:[
        {label:'Saldo',data:monthSaldo,backgroundColor:saldoColors,borderRadius:4,borderSkipped:false}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` Saldo: ${fmtPlain(c.raw)}`}}},
        scales:{x:{ticks:{font:{size:10}},grid:{display:false}},
          y:{ticks:{callback:v=>'$'+(v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v),font:{size:9}},
            grid:{color:'rgba(128,128,128,.1)'},
            afterDataLimits(scale){const m=Math.max(Math.abs(scale.min),Math.abs(scale.max));scale.min=-m*1.1;scale.max=m*1.1;}}}}});
  }

  // ── GRÁFICO 3: Dona distribución anual ──
  if(catLabels.length){
    const ctxPie=document.getElementById('dash-pie');
    if(ctxPie){
      dashCharts.pie=new Chart(ctxPie,{type:'doughnut',
        data:{labels:catLabels,datasets:[{data:catVals,backgroundColor:catColors,borderWidth:2,borderColor:'rgba(255,255,255,.15)',hoverBorderWidth:3}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'60%',
          plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${fmtPlain(c.raw)} (${Math.round(c.raw/catTotal*100)}%)`}}}}});
    }
  }

  // ── GRÁFICO 4: Barras horizontales por categoría ──
  if(catLabels.length){
    const ctxCat=document.getElementById('dash-bar-cat');
    if(ctxCat){
      dashCharts.barCat=new Chart(ctxCat,{type:'bar',
        data:{labels:catLabels,datasets:[{label:'Gasto anual',data:catVals,backgroundColor:catColors,borderRadius:4,borderSkipped:false}]},
        options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
          plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fmtPlain(c.raw)} (${Math.round(c.raw/catTotal*100)}%)`}}},
          scales:{x:{ticks:{callback:v=>'$'+(v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v),font:{size:9}},grid:{color:'rgba(128,128,128,.1)'}},
            y:{ticks:{font:{size:10}},grid:{display:false}}}}});
    }
  }
};

// ── CHANGELOG ─────────────────────────────────────────────────────────
window.showChangelog=()=>{
  document.getElementById('changelog-body').innerHTML=CHANGELOG.map(v=>`
    <div class="changelog-item">
      <div class="changelog-ver">v${v.ver}</div>
      <div class="changelog-date">${v.date}</div>
      <ul class="changelog-list">${v.changes.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>`).join('');
  document.getElementById('changelog-modal').style.display='flex';
};
window.hideChangelog=()=>document.getElementById('changelog-modal').style.display='none';

// ── LIMPIEZA ──────────────────────────────────────────────────────────
window.showClean=()=>{document.getElementById('cyl').textContent=CY;document.getElementById('clean-modal').style.display='flex';};
window.hideClean=()=>document.getElementById('clean-modal').style.display='none';

window.fixSobrantes=async()=>{
  if(!confirm('¿Corregir sobrantes huérfanos en todos los años? Elimina transferencias en quincenas sin ingreso registrado.')) return;
  hideClean();
  toast('🧹 Revisando sobrantes…');
  let limpiados=0;
  const yearActual=new Date().getFullYear();
  for(let y=MIN_YEAR;y<=yearActual;y++){
    for(let mi=0;mi<12;mi++){
      for(const q of [1,2]){
        try{
          delete cache[cacheKey(y,mi,q)];
          const d=await getPeriodo(y,mi,q);
          if((!d.income||d.income===0) && d.transferIn>0){
            d.transferIn=0; d.transferLabel='';
            await savePeriodo(y,mi,q,d);
            limpiados++;
          }
        }catch(e){}
      }
    }
  }
  toast(limpiados>0
    ?`✅ ${limpiados} sobrante${limpiados!==1?'s':''} huérfano${limpiados!==1?'s':''} corregido${limpiados!==1?'s':''}`
    :'✅ Sin sobrantes huérfanos');
  renderTabs();
};
window.cleanPeriod=async()=>{
  if(!confirm('¿Eliminar esta quincena?'))return;
  const{m,q}=CP;delete cache[cacheKey(CY,m,q)];
  try{await deleteDoc(doc(db,periodoRef(CY,m,q)));}catch(e){}
  window.hideClean();renderMain();toast('🗑 Quincena eliminada');
};
window.cleanYear=async()=>{
  if(!confirm(`¿Eliminar todo el año ${CY}?`))return;
  for(const[mi]of MN.entries())for(const q of[1,2]){delete cache[cacheKey(CY,mi,q)];try{await deleteDoc(doc(db,periodoRef(CY,mi,q)));}catch(e){}}
  window.hideClean();renderMain();toast(`🗑 Año ${CY} eliminado`);
};
window.cleanAll=async()=>{
  if(!confirm('¿Eliminar TODOS tus datos? Irreversible.'))return;
  cache={};
  try{const snap=await getDocs(collection(db,`${userRef()}/periodos`));const batch=writeBatch(db);snap.forEach(d=>batch.delete(d.ref));await batch.commit();await deleteDoc(doc(db,recRef()));}catch(e){}
  window.hideClean();renderMain();toast('🗑 Todos los datos eliminados');
};

// ── EXPORTAR ──────────────────────────────────────────────────────────
// ── TOAST ─────────────────────────────────────────────────────────────
function toast(msg,type=''){
  const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}
window.toast=toast;
window.showCats=()=>{renderCatsList();document.getElementById('cats-modal').style.display='flex';};
window.hideCats=()=>document.getElementById('cats-modal').style.display='none';

function renderCatsList(){
  const el=document.getElementById('cats-list');
  const defaultNames=CATS_DEFAULT.map(c=>c.nombre);
  el.innerHTML=CATS_OBJ.map((c,i)=>{
    const esDefault=defaultNames.includes(c.nombre);
    const color=getCatColor(c.nombre);
    return `
    <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface2);border-radius:var(--radius-sm);border:1.5px solid ${c.activa?'var(--border)':'var(--border)'};opacity:${c.activa?'1':'0.5'}">
      <span style="width:10px;height:10px;border-radius:2px;background:${color};flex-shrink:0"></span>
      <span style="flex:1;font-size:13px;font-weight:${c.activa?'600':'400'};color:var(--text);text-decoration:${c.activa?'none':'line-through'}">${c.nombre}</span>
      <span style="font-size:9px;color:var(--text3);margin-right:2px">${esDefault?'predeterminada':'personalizada'}</span>
      <!-- Toggle activa/inactiva -->
      <label class="tog" title="${c.activa?'Desactivar':'Activar'}" style="flex-shrink:0">
        <input type="checkbox" ${c.activa?'checked':''} onchange="window._toggleCat(${i},this.checked)">
        <span class="sldr"></span>
      </label>
      <!-- Eliminar solo personalizadas -->
      ${!esDefault
        ?`<button class="btn btn-d bsm" onclick="window._delCat(${i})" style="padding:3px 8px;margin-left:2px">✕</button>`
        :''
      }
    </div>`;
  }).join('');
}

window._toggleCat=async(idx,activa)=>{
  CATS_OBJ[idx].activa=activa;
  await saveCats();
  renderCatsList();
  toast(activa?`✅ "${CATS_OBJ[idx].nombre}" activada`:`⛔ "${CATS_OBJ[idx].nombre}" desactivada`);
};

window._addCat=async()=>{
  const input=document.getElementById('new-cat-input');
  const nombre=sanitize(input.value.trim());
  if(!nombre){toast('Escribe el nombre de la categoría','err');return;}
  if(CATS_OBJ.find(c=>c.nombre===nombre)){toast('Esa categoría ya existe','err');return;}
  const color=getNextColor();
  CATS_OBJ.push({nombre,activa:true,color});
  await saveCats();
  input.value='';
  renderCatsList();
  toast(`✅ Categoría "${nombre}" agregada`);
};

window._delCat=async(idx)=>{
  const cat=CATS_OBJ[idx];
  if(!confirm(`¿Eliminar la categoría "${cat.nombre}"? Los gastos que la usen conservarán el nombre.`)) return;
  CATS_OBJ.splice(idx,1);
  await saveCats();
  renderCatsList();
  toast(`🗑 Categoría "${cat.nombre}" eliminada`);
};

window._resetCats=async()=>{
  if(!confirm('¿Restaurar las categorías predeterminadas? Las personalizadas se eliminarán y todas quedarán activas.')) return;
  CATS_OBJ=[...CATS_DEFAULT];
  await saveCats();
  renderCatsList();
  toast('✅ Categorías restauradas');
};

// ── EDITAR REFERENCIA DE RECURRENTE ──────────────────────────────────
let editRefId=null;
window._editRef=async(id)=>{
  const lista=await getRec();
  const r=lista.find(x=>x.id===id);if(!r)return;
  editRefId=id;
  document.getElementById('edit-ref-desc').textContent=r.desc;
  document.getElementById('edit-ref-val').value=r.ref||'';
  document.getElementById('edit-ref-modal').style.display='flex';
};
window.hideEditRef=()=>document.getElementById('edit-ref-modal').style.display='none';
window.saveEditRef=async()=>{
  const ref=sanitize(document.getElementById('edit-ref-val').value.trim());
  const lista=await getRec();
  const idx=lista.findIndex(r=>r.id===editRefId);if(idx<0)return;
  lista[idx].ref=ref;
  await saveRec(lista);
  window.hideEditRef();
  renderRecList();
  toast('✅ Referencia actualizada');
};

// ── PWA: Registrar Service Worker ─────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/sw.js')
      .then(()=>console.log('SW registrado'))
      .catch(()=>{});
  });
}

// ── PWA: Prompt de instalación ────────────────────────────────────────
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt=e;
  // Mostrar botón de instalar si no está instalada
  const btn=document.createElement('button');
  btn.className='btn btn-p bsm';
  btn.style.cssText='position:fixed;bottom:80px;right:16px;z-index:800;box-shadow:0 4px 16px rgba(30,107,69,.4);border-radius:24px;padding:10px 18px;font-size:13px';
  btn.innerHTML='📲 Instalar app';
  btn.onclick=async()=>{
    deferredPrompt.prompt();
    const{outcome}=await deferredPrompt.userChoice;
    if(outcome==='accepted') toast('✅ App instalada correctamente');
    btn.remove(); deferredPrompt=null;
  };
  document.body.appendChild(btn);
  // Auto-ocultar después de 10 segundos
  setTimeout(()=>btn.remove(), 10000);
});

// ── SIDEBAR & BOTTOM NAV HELPERS ─────────────────────────────────
function sbNav(tab){
  if(tab==='dash'){setViewTab('d');}
  else{setViewTab('q');}
  document.querySelectorAll('.sb-item[id^="sbnav-"]').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('sbnav-'+tab);
  if(el)el.classList.add('active');
}
function bnActivate(tab){
  document.querySelectorAll('.bn-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('bn-'+tab);
  if(el)el.classList.add('active');
}
// Sync sidebar sync-dot with main sync-dot
function syncSbDot(cls,label){
  const d=document.getElementById('sync-dot-sb');
  const l=document.getElementById('sync-label-sb');
  if(d){d.className='sync-dot '+cls;}
  if(l)l.textContent=label;
}
</script>
